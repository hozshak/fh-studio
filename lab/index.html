<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FH STUDIO · LAB — Server 0101</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;width:100%;background:#06070a;overflow:hidden;font-family:ui-monospace,"Space Mono",monospace;color:#cfe;}
  #c{position:fixed;inset:0;display:block;width:100vw;height:100vh;}
  .title{position:fixed;left:20px;top:18px;font-size:13px;letter-spacing:.22em;color:#9fb0ff;text-transform:uppercase;z-index:5;}
  .title small{display:block;color:#5b6b7a;font-size:10px;margin-top:4px;letter-spacing:.16em;}
  .hud{position:fixed;left:20px;bottom:18px;font-size:11px;letter-spacing:.12em;color:#566;text-transform:uppercase;z-index:5;}
  .hud b{color:#7fe7c4;}
  .ui{position:fixed;right:20px;top:18px;display:flex;flex-direction:column;gap:10px;z-index:6;}
  .btn{appearance:none;cursor:pointer;background:rgba(20,26,34,.7);border:1px solid rgba(127,231,196,.3);color:#cfe;
       padding:11px 16px;font:600 12px/1 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;border-radius:10px;
       backdrop-filter:blur(8px);transition:border-color .2s,background .2s,transform .15s;min-width:170px;text-align:left;}
  .btn:hover{border-color:#7fe7c4;background:rgba(28,40,50,.8);}
  .btn:active{transform:scale(.97);}
  .btn.on{border-color:#7fe7c4;color:#7fe7c4;background:rgba(127,231,196,.12);}
  .btn span{float:right;opacity:.5;}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#7fe7c4;font-size:13px;letter-spacing:.2em;z-index:10;}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;color:#ff8a8a;font-size:14px;line-height:1.6;z-index:20;}
</style>
</head>
<body>
<div class="title">FH STUDIO · LAB<small>Modul 01 — Server / 0101</small></div>
<div id="boot">LADE 3D … 0101</div>
<div id="err"></div>
<canvas id="c"></canvas>
<div class="ui">
  <button class="btn" id="dive">Eintauchen <span>▶</span></button>
  <button class="btn" id="explode">Auseinandernehmen <span>⊞</span></button>
  <button class="btn" id="reset">Ansicht zurück <span>⟳</span></button>
</div>
<div class="hud">Ziehen = drehen &nbsp;·&nbsp; Scrollen = zoom &nbsp;·&nbsp; Rechtsklick = verschieben &nbsp;·&nbsp; <b>0101</b> live</div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
(function(){
  function fail(m){ var e=document.getElementById('err'); e.style.display='flex'; e.innerHTML=m; var b=document.getElementById('boot'); if(b)b.remove(); }
  if(typeof THREE==='undefined'){ fail('Three.js nicht geladen — liegt <b>three.min.js</b> neben dieser Seite?'); return; }

  var canvas=document.getElementById('c'), renderer;
  try{ renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,preserveDrawingBuffer:true}); }
  catch(e){ fail('Kein WebGL — bitte Chrome/Edge mit Hardware-Beschleunigung.'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
  if(renderer.outputColorSpace!==undefined) renderer.outputColorSpace=THREE.SRGBColorSpace; else renderer.outputEncoding=THREE.sRGBEncoding;

  var scene=new THREE.Scene();
  scene.background=new THREE.Color('#06070a');
  scene.fog=new THREE.Fog('#06070a',10,30);

  var camera=new THREE.PerspectiveCamera(48,1,0.1,120);
  var OUT={pos:new THREE.Vector3(3.6,2.3,5.4), tgt:new THREE.Vector3(0,1.1,0)};
  var IN ={pos:new THREE.Vector3(0,1.25,2.2), tgt:new THREE.Vector3(0,1.25,-8)};
  camera.position.copy(OUT.pos);

  function fitSize(){ var w=canvas.clientWidth||window.innerWidth||1280, h=canvas.clientHeight||window.innerHeight||720; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }

  var controls=new THREE.OrbitControls(camera,canvas);
  controls.enableDamping=true; controls.dampingFactor=0.08;
  controls.target.copy(OUT.tgt); controls.minDistance=1.2; controls.maxDistance=16; controls.maxPolarAngle=Math.PI*0.92;

  // ---- environment ----
  var ec=document.createElement('canvas'); ec.width=128; ec.height=512; var ex=ec.getContext('2d');
  var eg=ex.createLinearGradient(0,0,0,512);
  eg.addColorStop(0,'#06070a'); eg.addColorStop(0.45,'#15303a'); eg.addColorStop(0.7,'#2a4a6a'); eg.addColorStop(1,'#06070a');
  ex.fillStyle=eg; ex.fillRect(0,0,128,512);
  var etex=new THREE.CanvasTexture(ec); etex.mapping=THREE.EquirectangularReflectionMapping;
  var pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromEquirectangular(etex).texture; etex.dispose();
  scene.add(new THREE.AmbientLight(0xffffff,0.3));
  var key=new THREE.DirectionalLight(0xbcd0ff,2.2); key.position.set(4,6,4); scene.add(key);
  var rim=new THREE.DirectionalLight(0x6cf0c4,1.5); rim.position.set(-5,2,-3); scene.add(rim);

  // ---- 0101 backdrop texture (also used as a live screen) ----
  var bcv=document.createElement('canvas'); bcv.width=512; bcv.height=512; var bx=bcv.getContext('2d');
  var COLS=32,cw=bcv.width/COLS,drops=[]; for(var d2=0;d2<COLS;d2++) drops.push(Math.random()*-50);
  var btex=new THREE.CanvasTexture(bcv);
  function drawBinary(){ bx.fillStyle='rgba(6,7,10,0.20)'; bx.fillRect(0,0,bcv.width,bcv.height); bx.font='16px monospace';
    for(var i=0;i<COLS;i++){ var ch=Math.random()<0.5?'0':'1', x=i*cw, y=drops[i]*16;
      bx.fillStyle='#7fe7c4'; bx.fillText(ch,x,y); bx.fillStyle='rgba(60,140,120,0.45)'; bx.fillText(ch,x,y-16);
      if(y>bcv.height&&Math.random()>0.975) drops[i]=0; drops[i]++; }
    btex.needsUpdate=true; }

  // ---- server rack (modular) ----
  var SERVER=new THREE.Group(); scene.add(SERVER);
  var frameMat=new THREE.MeshStandardMaterial({color:0x14181f,metalness:0.9,roughness:0.35});
  function bar(w,h,d,x,y,z){ var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),frameMat); m.position.set(x,y,z); m.name='frame'; SERVER.add(m); }
  var RW=1.5,RH=2.4,RD=1.4,t=0.07,fz=(RD-0.12)/2;
  for(var a=-RW/2;a<=RW/2;a+=RW) for(var b2=-RD/2;b2<=RD/2;b2+=RD) bar(t,RH,t,a,RH/2,b2);
  bar(RW,t,RD,0,0,0); bar(RW,t,RD,0,RH,0);
  var back=new THREE.Mesh(new THREE.BoxGeometry(RW,RH,t),new THREE.MeshStandardMaterial({color:0x0c0f14,metalness:0.7,roughness:0.5}));
  back.position.set(0,RH/2,-RD/2); back.name='back-panel'; SERVER.add(back);

  var UNITS=[],leds=[];
  var unitFaceMat=new THREE.MeshStandardMaterial({color:0x1a2029,metalness:0.6,roughness:0.4});
  var ventMat=new THREE.MeshStandardMaterial({color:0x070a0e,metalness:0.3,roughness:0.9});
  var N=9,gap=0.04,uH=(RH-0.3)/N-gap;
  for(var i=0;i<N;i++){
    var u=new THREE.Group(); var y=0.2+uH/2+i*(uH+gap); u.position.set(0,y,0); u.name='unit-'+i; u.userData.baseY=y; u.userData.idx=i;
    var body=new THREE.Mesh(new THREE.BoxGeometry(RW-0.18,uH,RD-0.12),unitFaceMat); body.name='chassis'; u.add(body);
    var face=new THREE.Mesh(new THREE.BoxGeometry(RW-0.14,uH*0.96,0.02),new THREE.MeshStandardMaterial({color:0x222a34,metalness:0.7,roughness:0.3}));
    face.position.z=fz+0.011; u.add(face);
    for(var v=0;v<5;v++){ var slit=new THREE.Mesh(new THREE.BoxGeometry(0.16,uH*0.5,0.005),ventMat); slit.position.set(-RW/2+0.22+v*0.12,0,fz+0.02); u.add(slit); }
    for(var l=0;l<4;l++){ var hue=[0.35,0.5,0.12,0.55][l];
      var mat=new THREE.MeshStandardMaterial({color:0x111111,emissive:new THREE.Color().setHSL(hue,1,0.5),emissiveIntensity:1.2});
      var led=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,0.02),mat); led.position.set(RW/2-0.18-l*0.085,uH*0.18,fz+0.02); u.add(led);
      leds.push({mat:mat,hue:hue,speed:1+Math.random()*4,phase:Math.random()*6.28});
    }
    SERVER.add(u); UNITS.push(u);
  }

  // ---- DETAIL: live screen on a middle unit ----
  var screenUnit=UNITS[5];
  var screen=new THREE.Mesh(new THREE.PlaneGeometry(0.5,uH*0.6), new THREE.MeshBasicMaterial({map:btex}));
  screen.position.set(-0.35,0,fz+0.03); screenUnit.add(screen);
  var bezel=new THREE.Mesh(new THREE.BoxGeometry(0.56,uH*0.66,0.02), new THREE.MeshStandardMaterial({color:0x05080a,metalness:0.5,roughness:0.6}));
  bezel.position.set(-0.35,0,fz+0.024); screenUnit.add(bezel);

  // ---- DETAIL: back cables ----
  var cableMat=new THREE.MeshStandardMaterial({color:0x0a0d11,metalness:0.2,roughness:0.8});
  var cableCols=[0x2bd4a0,0x6c7bff,0xff8ad1,0xffb347];
  for(var cI=0;cI<6;cI++){
    var x0=-0.5+cI*0.2;
    var curve=new THREE.CatmullRomCurve3([
      new THREE.Vector3(x0,0.5+cI*0.25,-RD/2-0.02),
      new THREE.Vector3(x0*1.2,0.35+cI*0.22,-RD/2-0.35-Math.random()*0.2),
      new THREE.Vector3(x0*0.6,0.1+cI*0.2,-RD/2-0.15)
    ]);
    var tube=new THREE.Mesh(new THREE.TubeGeometry(curve,20,0.022,8,false),
      new THREE.MeshStandardMaterial({color:cableCols[cI%4],metalness:0.1,roughness:0.6,emissive:cableCols[cI%4],emissiveIntensity:0.12}));
    tube.name='cable'; SERVER.add(tube);
  }

  // ---- DETAIL: glass door (front) ----
  var door=new THREE.Mesh(new THREE.BoxGeometry(RW-0.05,RH-0.1,0.03),
    new THREE.MeshPhysicalMaterial({color:0xbfe9ff,metalness:0,roughness:0.05,transmission:0.92,thickness:0.4,ior:1.45,transparent:true,opacity:0.5}));
  door.position.set(0,RH/2,fz+0.06); door.name='glass-door'; SERVER.add(door);

  // ---- floor + grid ----
  var floor=new THREE.Mesh(new THREE.CircleGeometry(16,64),new THREE.MeshStandardMaterial({color:0x080a0e,metalness:0.85,roughness:0.5}));
  floor.rotation.x=-Math.PI/2; floor.position.y=-0.01; floor.name='floor'; scene.add(floor);
  var grid=new THREE.GridHelper(32,64,0x1b3340,0x10202a); scene.add(grid);

  // ---- 0101 DATA TUNNEL (streaks + digit sprites) ----
  // streak points flowing toward camera along -Z..+Z tube
  var PN=1400, pgeo=new THREE.BufferGeometry(), ppos=new Float32Array(PN*3), pspd=new Float32Array(PN);
  for(var p=0;p<PN;p++){ var r=0.4+Math.random()*3.2, ang=Math.random()*6.283;
    ppos[p*3]=Math.cos(ang)*r; ppos[p*3+1]=1.2+Math.sin(ang)*r; ppos[p*3+2]=-30+Math.random()*34; pspd[p]=2+Math.random()*5; }
  pgeo.setAttribute('position',new THREE.BufferAttribute(ppos,3));
  var pmat=new THREE.PointsMaterial({color:0x7fe7c4,size:0.05,transparent:true,opacity:0.0,blending:THREE.AdditiveBlending,depthWrite:false});
  var stream=new THREE.Points(pgeo,pmat); scene.add(stream);
  // digit sprites
  function digitTex(ch){ var c=document.createElement('canvas'); c.width=c.height=64; var g=c.getContext('2d');
    g.fillStyle='#7fe7c4'; g.font='bold 48px monospace'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(ch,32,34);
    var tx=new THREE.CanvasTexture(c); return tx; }
  var tex0=digitTex('0'), tex1=digitTex('1'); var sprites=[];
  for(var s=0;s<60;s++){ var sm=new THREE.SpriteMaterial({map:Math.random()<0.5?tex0:tex1,transparent:true,opacity:0.0,blending:THREE.AdditiveBlending,depthWrite:false});
    var sp=new THREE.Sprite(sm); var rr=0.5+Math.random()*2.8, aa=Math.random()*6.283;
    sp.position.set(Math.cos(aa)*rr,1.2+Math.sin(aa)*rr,-28+Math.random()*32); sp.scale.setScalar(0.22);
    sp.userData={spd:2+Math.random()*4}; scene.add(sp); sprites.push(sp); }

  // ---- interaction state ----
  var dive=0, diveTarget=0;        // 0 = outside, 1 = inside
  var explode=0, explodeTarget=0;  // 0 = assembled, 1 = exploded
  var bDive=document.getElementById('dive'), bEx=document.getElementById('explode'), bReset=document.getElementById('reset');
  bDive.onclick=function(){ diveTarget=diveTarget>0.5?0:1; bDive.classList.toggle('on',diveTarget>0.5); bDive.innerHTML=(diveTarget>0.5?'Auftauchen <span>◀</span>':'Eintauchen <span>▶</span>'); };
  bEx.onclick=function(){ explodeTarget=explodeTarget>0.5?0:1; bEx.classList.toggle('on',explodeTarget>0.5); };
  bReset.onclick=function(){ diveTarget=0; explodeTarget=0; bDive.classList.remove('on'); bEx.classList.remove('on'); bDive.innerHTML='Eintauchen <span>▶</span>'; };

  function smooth(x){ x=Math.min(1,Math.max(0,x)); return x*x*(3-2*x); }
  var _v=new THREE.Vector3();

  fitSize(); window.addEventListener('resize',fitSize);
  if(window.ResizeObserver) new ResizeObserver(fitSize).observe(canvas);

  var clock=new THREE.Clock(), frame=0;
  function render(){ if(canvas.width===0||canvas.height===0) fitSize();
    var dt=Math.min(clock.getDelta(),0.05), tNow=clock.elapsedTime;

    // dive interpolation
    dive += (diveTarget-dive)*Math.min(1,dt*2.2);
    explode += (explodeTarget-explode)*Math.min(1,dt*3.0);
    var dS=smooth(dive);

    // camera: blend OUT<->IN, OrbitControls only active when fully outside
    if(dive>0.001 || diveTarget>0.5){
      controls.enabled = dive<0.02;
      camera.position.lerpVectors(OUT.pos, IN.pos, dS);
      _v.lerpVectors(OUT.tgt, IN.tgt, dS); controls.target.copy(_v); camera.lookAt(_v);
    } else { controls.enabled=true; }

    // explode units
    for(var k=0;k<UNITS.length;k++){ var u=UNITS[k], e=smooth(explode), idx=u.userData.idx;
      u.position.z = e * (0.5 + idx*0.16);
      u.position.y = u.userData.baseY + (idx-(N-1)/2) * e * 0.10;
      u.rotation.x = e * 0.12 * Math.sin(idx*1.3);
    }
    // glass door opens (slides up + fades) when exploding
    door.position.y = RH/2 + smooth(explode)*RH*0.9;
    door.material.opacity = 0.5*(1-smooth(explode));

    // leds
    for(var li=0;li<leds.length;li++){ var L=leds[li], sn=Math.sin(tNow*L.speed+L.phase)*0.5+0.5, vv=0.35+0.65*sn*sn;
      L.mat.emissive.setHSL(L.hue,1,0.5*vv+0.08); L.mat.emissiveIntensity=0.6+vv*1.8; }

    // data tunnel: stronger & faster while diving
    var flow = 1 + dS*4, vis = 0.12 + dS*0.85;
    pmat.opacity = vis*0.9;
    var pa=pgeo.attributes.position.array;
    for(var pp=0;pp<PN;pp++){ pa[pp*3+2]+=pspd[pp]*flow*dt; if(pa[pp*3+2]>3){ pa[pp*3+2]=-30; } }
    pgeo.attributes.position.needsUpdate=true;
    for(var si=0;si<sprites.length;si++){ var sp=sprites[si]; sp.position.z+=sp.userData.spd*flow*dt; if(sp.position.z>3){ sp.position.z=-28; } sp.material.opacity=vis; }

    if(frame%2===0) drawBinary();
    if(controls.enabled) controls.update();
    renderer.render(scene,camera); frame++;
  }
  var bt=document.getElementById('boot'); if(bt)bt.remove();
  function loop(){ requestAnimationFrame(loop); render(); } loop();

  // verification hooks
  window.__tick=function(){ render(); };
  window.__setDive=function(v){ diveTarget=v; }; window.__setExplode=function(v){ explodeTarget=v; };
  window.__diag=function(){ var sz=new THREE.Vector2(); renderer.getSize(sz); return {size:[sz.x,sz.y],triangles:renderer.info.render.triangles,units:UNITS.length,leds:leds.length,dive:+dive.toFixed(2),explode:+explode.toFixed(2)}; };
})();
</script>
</body>
</html>
