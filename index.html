<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FH STUDIO — Hozan Shaker × Fynn Beckmann</title>
<meta name="description" content="FH Studio — an independent web design studio by Hozan Shaker & Fynn Beckmann. Premium, immersive, interactive websites.">
<meta property="og:title" content="FH STUDIO"><meta property="og:description" content="Independent web design studio · Hozan Shaker × Fynn Beckmann"><meta property="og:type" content="website">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{ --fg:#F4F3EE; --mut:#8a8a93; --accent:#7fe7c4; }
  html,body{height:100%;width:100%;background:#070809;overflow:hidden;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--fg);}
  #c{position:fixed;inset:0;display:block;width:100vw;height:100vh;}
  /* branding overlay */
  .brand{position:fixed;left:32px;top:28px;z-index:5;}
  .brand .logo{font-size:20px;font-weight:700;letter-spacing:.34em;}
  .brand .claim{margin-top:8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);}
  .corner{position:fixed;z-index:5;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);}
  .tr{right:32px;top:30px;text-align:right;}
  .bl{left:32px;bottom:26px;}
  .br{right:32px;bottom:26px;text-align:right;color:#5a5a63;}
  .corner b{color:var(--accent);}
  /* loader */
  #load{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070809;transition:opacity .8s;}
  #load .pct{font-size:42px;font-weight:700;letter-spacing:.04em;}
  #load .lbl{margin-top:12px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut);}
  #load.hide{opacity:0;pointer-events:none;}
  #err{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;color:#ff8a8a;font-size:14px;line-height:1.6;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="brand"><div class="logo">FH&nbsp;STUDIO</div><div class="claim">Independent web design studio</div></div>
<div class="corner tr">Hozan Shaker<br>× Fynn Beckmann</div>
<div class="corner bl">Ziehen = drehen &nbsp;·&nbsp; Scrollen = zoom</div>
<div class="corner br">Server · <b>0101</b></div>
<div id="load"><div class="pct" id="pct">0%</div><div class="lbl">FH Studio lädt</div></div>
<div id="err"></div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script src="meshopt_decoder.js"></script>
<script src="GLTFLoader.js"></script>
<script>
(function(){
  function fail(m){ var e=document.getElementById('err'); e.style.display='flex'; e.innerHTML=m; var l=document.getElementById('load'); if(l)l.classList.add('hide'); }
  if(typeof THREE==='undefined'){ fail('Three.js nicht geladen.'); return; }
  if(typeof THREE.GLTFLoader==='undefined'){ fail('GLTFLoader fehlt.'); return; }

  var canvas=document.getElementById('c'), renderer;
  try{ renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,preserveDrawingBuffer:true,alpha:false}); }
  catch(e){ fail('Kein WebGL — bitte Chrome/Edge mit Hardware-Beschleunigung.'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
  if(renderer.outputColorSpace!==undefined) renderer.outputColorSpace=THREE.SRGBColorSpace; else renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  var scene=new THREE.Scene(); scene.background=new THREE.Color('#070809');
  var camera=new THREE.PerspectiveCamera(42,1,0.01,1000); camera.position.set(3,2,5);

  function fitSize(){ var w=canvas.clientWidth||window.innerWidth||1280, h=canvas.clientHeight||window.innerHeight||720; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }

  var controls=new THREE.OrbitControls(camera,canvas);
  controls.enableDamping=true; controls.dampingFactor=0.07; controls.autoRotate=true; controls.autoRotateSpeed=0.55;

  // environment for reflections
  var ecv=document.createElement('canvas'); ecv.width=128; ecv.height=512; var ex=ecv.getContext('2d');
  var eg=ex.createLinearGradient(0,0,0,512);
  eg.addColorStop(0,'#0a0c10'); eg.addColorStop(0.45,'#22323f'); eg.addColorStop(0.7,'#3a5570'); eg.addColorStop(1,'#0a0c10');
  ex.fillStyle=eg; ex.fillRect(0,0,128,512);
  var etex=new THREE.CanvasTexture(ecv); etex.mapping=THREE.EquirectangularReflectionMapping;
  var pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromEquirectangular(etex).texture; etex.dispose();

  // lights
  scene.add(new THREE.AmbientLight(0xffffff,0.35));
  var key=new THREE.DirectionalLight(0xffffff,2.4); key.position.set(5,8,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048); key.shadow.bias=-0.0004;
  key.shadow.camera.near=0.5; key.shadow.camera.far=60; var sc=12; key.shadow.camera.left=-sc;key.shadow.camera.right=sc;key.shadow.camera.top=sc;key.shadow.camera.bottom=-sc;
  scene.add(key);
  var rim=new THREE.DirectionalLight(0x6cf0c4,1.2); rim.position.set(-6,3,-4); scene.add(rim);
  var fill=new THREE.DirectionalLight(0x9fb0ff,0.8); fill.position.set(0,2,8); scene.add(fill);

  var floor; // created after we know model size

  // ---- load the model ----
  var loader=new THREE.GLTFLoader();
  if(typeof MeshoptDecoder!=='undefined') loader.setMeshoptDecoder(MeshoptDecoder);
  var MODEL=null;

  loader.load('server.glb', function(gltf){
    MODEL=gltf.scene;
    // center + frame
    var box=new THREE.Box3().setFromObject(MODEL);
    var size=box.getSize(new THREE.Vector3());
    var center=box.getCenter(new THREE.Vector3());
    var maxDim=Math.max(size.x,size.y,size.z)||1;
    var s=3.0/maxDim;                       // normalize so largest dim ~3 units
    MODEL.scale.setScalar(s);
    // recompute after scale, drop to floor & center on origin
    box.setFromObject(MODEL); size=box.getSize(new THREE.Vector3()); center=box.getCenter(new THREE.Vector3());
    MODEL.position.x += -center.x; MODEL.position.z += -center.z; MODEL.position.y += -box.min.y;
    MODEL.traverse(function(o){ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; if(o.material){o.material.envMapIntensity=1.1;} } });
    scene.add(MODEL);

    // floor sized to model
    var fr=Math.max(size.x,size.z)*3+2;
    floor=new THREE.Mesh(new THREE.CircleGeometry(fr,64), new THREE.MeshStandardMaterial({color:0x0a0c10,metalness:0.6,roughness:0.55}));
    floor.rotation.x=-Math.PI/2; floor.position.y=0; floor.receiveShadow=true; scene.add(floor);
    var grid=new THREE.GridHelper(fr*2,60,0x1b3340,0x12202a); grid.position.y=0.002; scene.add(grid);

    // frame camera around model
    var h=size.y, r=Math.max(size.x,size.z,h)*0.5;
    controls.target.set(0,h*0.5,0);
    camera.position.set(r*1.8,h*0.7,r*2.4);
    camera.near=r/100; camera.far=r*100; camera.updateProjectionMatrix();
    controls.minDistance=r*0.6; controls.maxDistance=r*8;
    controls.maxPolarAngle=Math.PI*0.92; controls.update();

    var l=document.getElementById('load'); if(l){ l.classList.add('hide'); setTimeout(function(){ if(l.parentNode) l.parentNode.removeChild(l); },900); }
  }, function(xhr){
    if(xhr && xhr.total){ var p=Math.round(xhr.loaded/xhr.total*100); var el=document.getElementById('pct'); if(el) el.textContent=p+'%'; }
  }, function(err){ fail('Modell konnte nicht geladen werden.<br><small>'+(err&&err.message?err.message:err)+'</small>'); });

  fitSize(); window.addEventListener('resize',fitSize);
  if(window.ResizeObserver) new ResizeObserver(fitSize).observe(canvas);

  function render(){ if(canvas.width===0||canvas.height===0) fitSize(); controls.update(); renderer.render(scene,camera); }
  function loop(){ requestAnimationFrame(loop); render(); } loop();

  // verification hooks
  window.__tick=function(){ render(); };
  window.__diag=function(){ var sz=new THREE.Vector2(); renderer.getSize(sz); var meshes=0,tri=renderer.info.render.triangles;
    if(MODEL) MODEL.traverse(function(o){ if(o.isMesh) meshes++; });
    return {size:[sz.x,sz.y],loaded:!!MODEL,meshes:meshes,triangles:tri,calls:renderer.info.render.calls,cam:camera.position.toArray().map(function(n){return +n.toFixed(2);})}; };
})();
</script>
</body>
</html>
