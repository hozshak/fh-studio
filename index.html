<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FH STUDIO — The Clockwork</title>
<meta name="description" content="FH Studio — a mechanical clock. Click an hour to see what turns.">
<meta property="og:title" content="FH STUDIO — Clockwork"><meta property="og:type" content="website">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{ --bg:#0c0a08; --fg:#f0e6d2; --mut:#9a8a6a; --brass:#caa14a; --brass2:#7c5c26; --steel:#8891a0; }
  html,body{height:100%;background:radial-gradient(120% 120% at 50% 40%,#1a150e,#080706 75%);color:var(--fg);
    font-family:"Space Grotesk",-apple-system,"Segoe UI",Georgia,serif;overflow:hidden;}
  .top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;padding:24px 34px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--mut);}
  .top b{color:var(--fg);letter-spacing:.34em;}
  .bot{position:fixed;bottom:0;left:0;right:0;z-index:5;text-align:center;padding:18px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);}
  .bot b{color:var(--brass);}

  #wrap{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92vmin,860px);height:min(92vmin,860px);}
  svg{width:100%;height:100%;display:block;overflow:visible;}
  .gear{transform-box:fill-box;transform-origin:center;animation:spin var(--d,10s) linear infinite;}
  .gear.r{animation-name:spinR;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinR{to{transform:rotate(-360deg)}}
  #gears.wind .gear{animation-duration:.9s;}
  #gears .gear{transition:none;}

  /* numerals */
  #nums{position:absolute;inset:0;}
  .hour{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:var(--fg);
    cursor:pointer;transition:transform .25s,color .25s,box-shadow .3s,background .3s;user-select:none;}
  .hour:hover,.hour.on{color:#1a140a;background:radial-gradient(circle,#e8c874,#b8892f);transform:scale(1.18);
    box-shadow:0 0 34px rgba(202,161,74,.7);}
  .hour small{position:absolute;bottom:-2px;font-size:8px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;}

  #center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
  #center .fh{font-size:22px;font-weight:700;letter-spacing:.3em;color:var(--brass);}
  #center .dig{font-size:12px;letter-spacing:.2em;color:var(--mut);margin-top:4px;font-variant-numeric:tabular-nums;}

  /* reveal panel */
  #panel{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  #panel .card{width:min(520px,86vw);background:linear-gradient(180deg,#171208,#0e0b06);border:1px solid rgba(202,161,74,.35);
    border-radius:16px;padding:34px 34px 30px;text-align:center;box-shadow:0 40px 120px rgba(0,0,0,.7);
    opacity:0;transform:translateY(24px) scale(.96);transition:.5s cubic-bezier(.16,1,.3,1);}
  #panel.show{pointer-events:auto;}
  #panel.show .card{opacity:1;transform:none;}
  #panel .card:before{content:"";position:absolute;inset:0;background:rgba(6,5,4,.6);z-index:-1;}
  #panel .num{font-size:70px;font-weight:700;color:var(--brass);line-height:1;}
  #panel .cog{width:74px;height:74px;margin:14px auto 6px;animation:spin 4s linear infinite;}
  #panel h2{font-size:20px;margin-top:6px;}
  #panel p{margin-top:12px;font-size:14px;line-height:1.6;color:#c9bd9f;}
  #panel .close{margin-top:22px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);cursor:pointer;border:1px solid rgba(154,138,106,.4);border-radius:20px;padding:8px 20px;display:inline-block;}
  #panel .close:hover{color:var(--fg);border-color:var(--brass);}
  #scrim{position:fixed;inset:0;background:rgba(4,3,2,.55);opacity:0;transition:opacity .5s;pointer-events:none;z-index:19;}
  #panel.show ~ #scrim,#scrim.on{opacity:1;}
</style>
</head>
<body>
<div class="top"><span><b>FH&nbsp;STUDIO</b> — The Clockwork</span><span>Est. 2026</span></div>

<div id="wrap">
  <svg id="clock" viewBox="-500 -500 1000 1000">
    <defs>
      <radialGradient id="brass" cx="40%" cy="35%" r="75%"><stop offset="0%" stop-color="#e6c574"/><stop offset="55%" stop-color="#b98f38"/><stop offset="100%" stop-color="#6e5122"/></radialGradient>
      <radialGradient id="steel" cx="40%" cy="35%" r="75%"><stop offset="0%" stop-color="#c2ccd8"/><stop offset="60%" stop-color="#7d8794"/><stop offset="100%" stop-color="#3c424c"/></radialGradient>
      <radialGradient id="dialg" cx="50%" cy="45%" r="60%"><stop offset="0%" stop-color="#141009"/><stop offset="100%" stop-color="#060504"/></radialGradient>
    </defs>
    <g id="gears"></g>
    <circle r="330" fill="url(#dialg)" stroke="#3a2c14" stroke-width="6"/>
    <g id="ticks"></g>
    <g id="hands">
      <line id="hh" x1="0" y1="30" x2="0" y2="-190" stroke="#e8d9b0" stroke-width="12" stroke-linecap="round"/>
      <line id="mh" x1="0" y1="40" x2="0" y2="-270" stroke="#f0e6d2" stroke-width="7" stroke-linecap="round"/>
      <line id="sh" x1="0" y1="70" x2="0" y2="-300" stroke="#caa14a" stroke-width="3" stroke-linecap="round"/>
      <circle r="14" fill="url(#brass)" stroke="#3a2c14" stroke-width="3"/>
    </g>
  </svg>
  <div id="nums"></div>
  <div id="center"><div class="fh">FH</div><div class="dig" id="dig">00:00:00</div></div>
</div>

<div class="bot">Click an <b>hour</b> — see what turns</div>

<div id="panel"><div class="card">
  <div class="num" id="pn">03</div>
  <svg class="cog" viewBox="-50 -50 100 100"><g id="pcog"></g></svg>
  <h2 id="pt">The third turn</h2>
  <p id="pp"></p>
  <span class="close" id="pclose">Close ✕</span>
</div></div>
<div id="scrim"></div>

<script>
(function(){
  var svgNS="http://www.w3.org/2000/svg";
  // ---- gear builder ----
  function gear(teeth,rO,rV,rHub,grad){ var g=document.createElementNS(svgNS,'g');
    var body=document.createElementNS(svgNS,'circle'); body.setAttribute('r',rV); body.setAttribute('fill',grad); body.setAttribute('stroke','#3a2c14'); body.setAttribute('stroke-width','2'); g.appendChild(body);
    for(var i=0;i<teeth;i++){ var a=i*360/teeth; var t=document.createElementNS(svgNS,'rect');
      var tw=(2*Math.PI*rV/teeth)*0.55; t.setAttribute('x',-tw/2); t.setAttribute('y',-rO); t.setAttribute('width',tw); t.setAttribute('height',rO-rV+2); t.setAttribute('rx',tw*0.2);
      t.setAttribute('fill',grad); t.setAttribute('stroke','#3a2c14'); t.setAttribute('stroke-width','1.5'); t.setAttribute('transform','rotate('+a+')'); g.appendChild(t); }
    var hub=document.createElementNS(svgNS,'circle'); hub.setAttribute('r',rHub); hub.setAttribute('fill','#0e0b06'); hub.setAttribute('stroke','#3a2c14'); hub.setAttribute('stroke-width','3'); g.appendChild(hub);
    for(var b=0;b<5;b++){ var bo=document.createElementNS(svgNS,'circle'); var ang=b*72*Math.PI/180; bo.setAttribute('cx',Math.cos(ang)*rHub*0.55); bo.setAttribute('cy',Math.sin(ang)*rHub*0.55); bo.setAttribute('r',rHub*0.14); bo.setAttribute('fill','#2a2010'); g.appendChild(bo); }
    return g; }
  function placeGear(x,y,teeth,rO,rV,rHub,grad,dur,rev){ var wrap=document.createElementNS(svgNS,'g'); wrap.setAttribute('transform','translate('+x+','+y+')');
    var gg=gear(teeth,rO,rV,rHub,grad); gg.setAttribute('class','gear'+(rev?' r':'')); gg.style.setProperty('--d',dur+'s'); wrap.appendChild(gg); document.getElementById('gears').appendChild(wrap); return gg; }

  var GEARS=document.getElementById('gears');
  placeGear(0,0, 40, 320,300,80,'url(#brass)', 60,false);         // huge slow背 gear
  placeGear(-300,-250, 18,120,104,34,'url(#steel)',14,true);
  placeGear(320,-230, 22,150,132,40,'url(#brass)',18,false);
  placeGear(340,260, 16,100,86,28,'url(#steel)',11,true);
  placeGear(-330,280, 20,130,114,36,'url(#brass)',16,false);
  placeGear(-150,360, 12,74,62,20,'url(#steel)',8,true);
  placeGear(180,-370, 12,74,62,20,'url(#brass)',9,false);

  // ---- ticks ----
  var ticks=document.getElementById('ticks');
  for(var i=0;i<60;i++){ var a=i*6*Math.PI/180, big=(i%5===0); var r1=big?290:302, r2=318;
    var l=document.createElementNS(svgNS,'line'); l.setAttribute('x1',Math.sin(a)*r1); l.setAttribute('y1',-Math.cos(a)*r1); l.setAttribute('x2',Math.sin(a)*r2); l.setAttribute('y2',-Math.cos(a)*r2);
    l.setAttribute('stroke',big?'#caa14a':'#5a4a2a'); l.setAttribute('stroke-width',big?4:2); ticks.appendChild(l); }

  // ---- numerals (clickable hours) ----
  var CAP=[
    "Where the day begins again — a clean sheet, a first idea.",
    "Two minds meet. Hozan and Fynn, sketching in the dark.",
    "The engine warms. Concepts start to turn.",
    "Structure locks in. Every gear finds its tooth.",
    "Motion enters — the first pixels start to move.",
    "Light and shadow. The interface learns to breathe.",
    "Midday tension: we break it, then rebuild it better.",
    "Precision hours. Nothing ships that isn't exact.",
    "The polish pass — friction sanded away.",
    "It goes live. The mechanism runs on its own.",
    "We listen to it tick. Measure. Refine.",
    "Midnight — the loop closes, ready to begin anew."
  ];
  var TITLES=["First Light","The Meeting","Warm-Up","Structure","Motion","Depth","High Noon","Precision","Polish","Launch","Feedback","Midnight"];
  var nums=document.getElementById('nums');
  for(var h=1;h<=12;h++){ var ang=(h/12)*2*Math.PI - Math.PI/2; var el=document.createElement('div'); el.className='hour';
    el.style.left=(50+Math.cos(ang)*41)+'%'; el.style.top=(50+Math.sin(ang)*41)+'%'; el.setAttribute('data-h',h);
    el.innerHTML=h+'<small>'+TITLES[h-1]+'</small>'; el.addEventListener('click',(function(hh){ return function(){ openHour(hh); }; })(h)); nums.appendChild(el); }

  // reveal panel
  var panel=document.getElementById('panel'), scrim=document.getElementById('scrim');
  var pcog=gear(12,46,38,14,'url(#brass)'); document.getElementById('pcog').appendChild(pcog);
  function openHour(h){ document.querySelectorAll('.hour').forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-h')===h); });
    document.getElementById('pn').textContent=String(h).padStart(2,'0');
    document.getElementById('pt').textContent=TITLES[h-1];
    document.getElementById('pp').textContent=CAP[h-1];
    panel.classList.add('show'); scrim.classList.add('on');
    GEARS.classList.add('wind'); setTimeout(function(){ GEARS.classList.remove('wind'); },1400);   // clockwork winds up
  }
  function closeP(){ panel.classList.remove('show'); scrim.classList.remove('on'); document.querySelectorAll('.hour').forEach(function(e){ e.classList.remove('on'); }); }
  document.getElementById('pclose').addEventListener('click',closeP); scrim.addEventListener('click',closeP);
  addEventListener('keydown',function(e){ if(e.key==='Escape')closeP(); });

  // ---- live time → hands ----
  var hh=document.getElementById('hh'), mh=document.getElementById('mh'), sh=document.getElementById('sh'), dig=document.getElementById('dig');
  function upd(){ var d=new Date(); var s=d.getSeconds(), m=d.getMinutes(), hr=d.getHours();
    hh.setAttribute('transform','rotate('+((hr%12)+m/60)*30+')'); mh.setAttribute('transform','rotate('+(m+s/60)*6+')'); sh.setAttribute('transform','rotate('+s*6+')');
    dig.textContent=[hr,m,s].map(function(n){return String(n).padStart(2,'0');}).join(':'); }
  upd(); setInterval(upd,1000);

  window.__diag=function(){ return {gears:GEARS.querySelectorAll('.gear').length, hours:document.querySelectorAll('.hour').length, ticks:ticks.children.length, panelOpen:panel.classList.contains('show'), time:dig.textContent}; };
  window.__openHour=function(h){ openHour(h); return window.__diag(); };
})();
</script>
</body>
</html>
