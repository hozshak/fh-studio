<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FH STUDIO — Hozan Shaker × Fynn Beckmann</title>
<meta name="description" content="FH Studio — an independent web design studio by Hozan Shaker & Fynn Beckmann. Immersive, interactive 3D websites.">
<meta property="og:title" content="FH STUDIO"><meta property="og:description" content="Independent web design studio · Hozan Shaker × Fynn Beckmann"><meta property="og:type" content="website">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{ --fg:#ffe9f6; --mut:#c98ab4; --accent:#ff5cc8; }
  html,body{height:100%;width:100%;background:#140510;overflow:hidden;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--fg);}
  #c{position:fixed;inset:0;display:block;width:100vw;height:100vh;}
  .brand{position:fixed;left:32px;top:28px;z-index:5;}
  .brand .logo{font-size:20px;font-weight:700;letter-spacing:.34em;text-shadow:0 0 24px rgba(255,92,200,.5);}
  .brand .claim{margin-top:8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);}
  .corner{position:fixed;z-index:5;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);}
  .bl{left:32px;bottom:26px;}
  #load{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#140510;transition:opacity .8s;}
  #load .pct{font-size:42px;font-weight:700;color:#ff8ad8;text-shadow:0 0 30px rgba(255,92,200,.6);}
  #load .lbl{margin-top:12px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut);}
  #load.hide{opacity:0;pointer-events:none;}
  #err{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;color:#ff8a8a;font-size:14px;line-height:1.6;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="brand"><div class="logo">FH&nbsp;STUDIO</div><div class="claim">Pink Cave</div></div>
<div class="corner bl">Ziehen = umsehen &nbsp;·&nbsp; Scrollen = zoom</div>
<div id="load"><div class="pct" id="pct">0%</div><div class="lbl">Höhle lädt</div></div>
<div id="err"></div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script src="meshopt_decoder.js"></script>
<script src="GLTFLoader.js"></script>
<script>
(function(){
  function fail(m){ var e=document.getElementById('err'); e.style.display='flex'; e.innerHTML=m; var l=document.getElementById('load'); if(l)l.classList.add('hide'); }
  if(typeof THREE==='undefined'){ fail('Three.js nicht geladen.'); return; }
  if(typeof THREE.GLTFLoader==='undefined'){ fail('GLTFLoader fehlt.'); return; }

  var canvas=document.getElementById('c'), renderer;
  try{ renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,preserveDrawingBuffer:true}); }
  catch(e){ fail('Kein WebGL — bitte Chrome/Edge.'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15;
  if(renderer.outputColorSpace!==undefined) renderer.outputColorSpace=THREE.SRGBColorSpace; else renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  var scene=new THREE.Scene();
  scene.background=new THREE.Color('#1a0614');
  scene.fog=new THREE.FogExp2('#2a0820',0.045);

  var camera=new THREE.PerspectiveCamera(50,1,0.05,200); camera.position.set(0,1.6,7);
  function fitSize(){ var w=canvas.clientWidth||window.innerWidth||1280, h=canvas.clientHeight||window.innerHeight||720; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }

  var controls=new THREE.OrbitControls(camera,canvas);
  controls.enableDamping=true; controls.dampingFactor=0.07; controls.minDistance=2; controls.maxDistance=18; controls.maxPolarAngle=Math.PI*0.96;
  controls.autoRotate=true; controls.autoRotateSpeed=0.5;

  // pink env for model reflections
  var ecv=document.createElement('canvas'); ecv.width=128; ecv.height=512; var ex=ecv.getContext('2d');
  var eg=ex.createLinearGradient(0,0,0,512);
  eg.addColorStop(0,'#1a0614'); eg.addColorStop(0.5,'#ff3ca0'); eg.addColorStop(0.75,'#ff8ad8'); eg.addColorStop(1,'#2a0820');
  ex.fillStyle=eg; ex.fillRect(0,0,128,512);
  var etex=new THREE.CanvasTexture(ecv); etex.mapping=THREE.EquirectangularReflectionMapping;
  var pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromEquirectangular(etex).texture; etex.dispose();

  // ---- rockify helper: lumpy organic displacement ----
  function rockify(geo,amp,freq){ var pos=geo.attributes.position, v=new THREE.Vector3(), n=new THREE.Vector3();
    for(var i=0;i<pos.count;i++){ v.fromBufferAttribute(pos,i); n.copy(v).normalize();
      var d=Math.sin(n.x*freq)*Math.cos(n.y*freq*1.3)*Math.sin(n.z*freq*0.7)
           +0.5*Math.sin(n.x*freq*2.1+1.0)*Math.sin(n.z*freq*1.7+0.5)
           +0.25*Math.cos(n.y*freq*3.3);
      v.addScaledVector(n,d*amp); pos.setXYZ(i,v.x,v.y,v.z); }
    pos.needsUpdate=true; geo.computeVertexNormals(); }

  // ---- cave shell (inside of a rocky sphere) ----
  var caveGeo=new THREE.IcosahedronGeometry(16,24); rockify(caveGeo,2.6,3.2);
  var caveMat=new THREE.MeshStandardMaterial({color:0x3a0d28,roughness:0.95,metalness:0.0,side:THREE.BackSide,
    emissive:0x400826,emissiveIntensity:0.35});
  var cave=new THREE.Mesh(caveGeo,caveMat); cave.position.y=6; scene.add(cave);

  // ---- rocky floor ----
  var floorGeo=new THREE.PlaneGeometry(40,40,80,80); floorGeo.rotateX(-Math.PI/2);
  (function(){ var pos=floorGeo.attributes.position, v=new THREE.Vector3();
    for(var i=0;i<pos.count;i++){ v.fromBufferAttribute(pos,i); var r=Math.sqrt(v.x*v.x+v.z*v.z);
      var y=Math.sin(v.x*0.5)*Math.cos(v.z*0.5)*0.25+Math.sin(r*0.8)*0.15+ (Math.random()*0.06);
      pos.setY(i,y); } pos.needsUpdate=true; floorGeo.computeVertexNormals(); })();
  var floor=new THREE.Mesh(floorGeo,new THREE.MeshStandardMaterial({color:0x2a0820,roughness:0.9,metalness:0.0,emissive:0x250617,emissiveIntensity:0.2}));
  floor.position.y=-0.02; floor.receiveShadow=true; scene.add(floor);

  // ---- pink lighting ----
  scene.add(new THREE.AmbientLight(0xff7ad0,0.5));
  var key=new THREE.SpotLight(0xff5cc8,40,40,Math.PI*0.4,0.6,1.2); key.position.set(4,9,5); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048); key.shadow.bias=-0.0005; scene.add(key);
  var p1=new THREE.PointLight(0xff2e9a,30,30,2); p1.position.set(-6,4,-3); scene.add(p1);
  var p2=new THREE.PointLight(0xff8ad8,22,28,2); p2.position.set(6,3,-5); scene.add(p2);
  var p3=new THREE.PointLight(0xbb44ff,18,26,2); p3.position.set(0,2,7); scene.add(p3);

  // ---- glowing pink crystals ----
  var crystals=[];
  var cgeo=new THREE.OctahedronGeometry(0.4,0);
  for(var ci=0;ci<14;ci++){ var hue=0.86+Math.random()*0.1;
    var cm=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(hue,1,0.6),emissive:new THREE.Color().setHSL(hue,1,0.55),emissiveIntensity:1.6,roughness:0.3,metalness:0.1});
    var cr=new THREE.Mesh(cgeo,cm); var ang=Math.random()*6.283, rad=5+Math.random()*8;
    cr.position.set(Math.cos(ang)*rad, Math.random()*5, Math.sin(ang)*rad); cr.scale.setScalar(0.5+Math.random()*1.4);
    cr.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3); scene.add(cr); crystals.push(cr); }

  // ---- floating dust particles ----
  var PN=600, pg=new THREE.BufferGeometry(), pp=new Float32Array(PN*3);
  for(var p=0;p<PN;p++){ pp[p*3]=(Math.random()-0.5)*30; pp[p*3+1]=Math.random()*12; pp[p*3+2]=(Math.random()-0.5)*30; }
  pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
  var dust=new THREE.Points(pg,new THREE.PointsMaterial({color:0xff9ad8,size:0.05,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending,depthWrite:false}));
  scene.add(dust);

  // ---- load model ----
  var loader=new THREE.GLTFLoader();
  if(typeof MeshoptDecoder!=='undefined') loader.setMeshoptDecoder(MeshoptDecoder);
  var MODEL=null, baseY=0, mixer=null, waveAction=null;
  loader.load('robot.glb', function(gltf){
    MODEL=gltf.scene;
    var box=new THREE.Box3().setFromObject(MODEL); var size=box.getSize(new THREE.Vector3());
    var maxDim=Math.max(size.x,size.y,size.z)||1; var s=3.4/maxDim; MODEL.scale.setScalar(s);
    box.setFromObject(MODEL); size=box.getSize(new THREE.Vector3()); var center=box.getCenter(new THREE.Vector3());
    MODEL.position.x+=-center.x; MODEL.position.z+=-center.z; MODEL.position.y+=-box.min.y; baseY=MODEL.position.y;
    MODEL.traverse(function(o){ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; if(o.material) o.material.envMapIntensity=1.0; } });
    scene.add(MODEL);
    // play the "Wave" animation — the hand actually waves
    if(gltf.animations && gltf.animations.length){
      mixer=new THREE.AnimationMixer(MODEL);
      var clip=THREE.AnimationClip.findByName(gltf.animations,'Wave')||gltf.animations[0];
      waveAction=mixer.clipAction(clip); waveAction.play();
      window.__mixer=mixer; window.__model=MODEL; window.__clip=clip.name;
    }
    var h=size.y; controls.target.set(0,h*0.55,0);
    camera.position.set(h*0.9,h*0.6,h*1.7); controls.update();
    var l=document.getElementById('load'); if(l){ l.classList.add('hide'); setTimeout(function(){ if(l.parentNode)l.parentNode.removeChild(l); },900); }
  }, function(xhr){ if(xhr&&xhr.total){ var el=document.getElementById('pct'); if(el) el.textContent=Math.round(xhr.loaded/xhr.total*100)+'%'; } },
     function(err){ fail('Modell konnte nicht geladen werden.<br><small>'+(err&&err.message?err.message:err)+'</small>'); });

  fitSize(); window.addEventListener('resize',fitSize);
  if(window.ResizeObserver) new ResizeObserver(fitSize).observe(canvas);

  var clock=new THREE.Clock();
  function render(){ if(canvas.width===0||canvas.height===0) fitSize();
    var dt=clock.getDelta(), t=clock.elapsedTime;
    if(mixer) mixer.update(dt);                 // drives the Wave animation (hand waves)
    // pulsing crystals + lights
    for(var i=0;i<crystals.length;i++){ var c=crystals[i]; c.rotation.y+=0.005; c.material.emissiveIntensity=1.2+Math.sin(t*2+i)*0.6; }
    p1.intensity=24+Math.sin(t*1.3)*8; p2.intensity=18+Math.sin(t*1.7+1)*6;
    dust.rotation.y=t*0.02; dust.position.y=Math.sin(t*0.3)*0.5;
    controls.update(); renderer.render(scene,camera);
  }
  function loop(){ requestAnimationFrame(loop); render(); } loop();

  window.__tick=function(){ render(); };
  window.__diag=function(){ var sz=new THREE.Vector2(); renderer.getSize(sz); var m=0;
    if(MODEL) MODEL.traverse(function(o){ if(o.isMesh)m++; });
    return {size:[sz.x,sz.y],loaded:!!MODEL,modelMeshes:m,triangles:renderer.info.render.triangles,calls:renderer.info.render.calls}; };
})();
</script>
</body>
</html>
