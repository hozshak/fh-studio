<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FH STUDIO — Hozan Shaker × Fynn Beckmann</title>
<meta name="description" content="FH Studio — an independent web design studio by Hozan Shaker & Fynn Beckmann.">
<meta property="og:title" content="FH STUDIO"><meta property="og:description" content="Independent web design studio · Hozan Shaker × Fynn Beckmann"><meta property="og:type" content="website">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{ --fg:#eaf0ff; --mut:#7d86a8; }
  html,body{height:100%;width:100%;background:#03040a;overflow:hidden;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--fg);}
  #c{position:fixed;inset:0;display:block;width:100vw;height:100vh;cursor:grab;}
  #c:active{cursor:grabbing;}
  .brand{position:fixed;left:32px;top:28px;z-index:5;}
  .brand .logo{font-size:20px;font-weight:700;letter-spacing:.34em;text-shadow:0 0 24px rgba(120,150,255,.5);}
  .brand .claim{margin-top:8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);}
  .corner{position:fixed;left:32px;bottom:26px;z-index:5;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);}
  #load{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#03040a;transition:opacity .8s;}
  #load .pct{font-size:42px;font-weight:700;color:#9fb4ff;text-shadow:0 0 30px rgba(120,150,255,.6);}
  #load .lbl{margin-top:12px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut);}
  #load.hide{opacity:0;pointer-events:none;}
  #err{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;color:#ff8a8a;font-size:14px;line-height:1.6;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="brand"><div class="logo">FH&nbsp;STUDIO</div><div class="claim">Galaxy</div></div>
<div class="corner">Ziehen = drehen &nbsp;·&nbsp; Scrollen = zoom</div>
<div id="load"><div class="pct" id="pct">0%</div><div class="lbl">Galaxy lädt</div></div>
<div id="err"></div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script src="meshopt_decoder.js"></script>
<script src="GLTFLoader.js"></script>
<script>
(function(){
  function fail(m){ var e=document.getElementById('err'); e.style.display='flex'; e.innerHTML=m; var l=document.getElementById('load'); if(l)l.classList.add('hide'); }
  if(typeof THREE==='undefined'){ fail('Three.js nicht geladen.'); return; }
  if(typeof THREE.GLTFLoader==='undefined'){ fail('GLTFLoader fehlt.'); return; }
  var canvas=document.getElementById('c'), renderer;
  try{ renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,preserveDrawingBuffer:true}); }
  catch(e){ fail('Kein WebGL — bitte Chrome/Edge.'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.2;
  if(renderer.outputColorSpace!==undefined) renderer.outputColorSpace=THREE.SRGBColorSpace; else renderer.outputEncoding=THREE.sRGBEncoding;

  var scene=new THREE.Scene(); scene.background=new THREE.Color('#03040a');
  var camera=new THREE.PerspectiveCamera(50,1,0.01,200); camera.position.set(4,3,6);
  function fitSize(){ var w=canvas.clientWidth||window.innerWidth||1280, h=canvas.clientHeight||window.innerHeight||720; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
  var controls=new THREE.OrbitControls(camera,canvas);
  controls.enableDamping=true; controls.dampingFactor=0.07; controls.minDistance=1.5; controls.maxDistance=40;

  // env for the model (subtle cool studio)
  var ecv=document.createElement('canvas'); ecv.width=128; ecv.height=512; var ex=ecv.getContext('2d');
  var eg=ex.createLinearGradient(0,0,0,512); eg.addColorStop(0,'#05060f'); eg.addColorStop(0.5,'#27407a'); eg.addColorStop(0.8,'#8a6cff'); eg.addColorStop(1,'#05060f');
  ex.fillStyle=eg; ex.fillRect(0,0,128,512);
  var etex=new THREE.CanvasTexture(ecv); etex.mapping=THREE.EquirectangularReflectionMapping;
  var pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromEquirectangular(etex).texture; etex.dispose();
  scene.add(new THREE.AmbientLight(0xffffff,0.4));
  var l1=new THREE.DirectionalLight(0x9fb4ff,2.2); l1.position.set(5,6,4); scene.add(l1);
  var l2=new THREE.DirectionalLight(0xff8ad8,1.4); l2.position.set(-5,-2,-3); scene.add(l2);

  // ===== GALAXY =====
  var G={count:24000, radius:7, branches:4, spin:1.1, randomness:0.55, power:3.0, inside:new THREE.Color('#ffae5a'), outside:new THREE.Color('#5b6bff')};
  var gg=new THREE.BufferGeometry(), gpos=new Float32Array(G.count*3), gcol=new Float32Array(G.count*3);
  for(var i=0;i<G.count;i++){ var r=Math.pow(Math.random(),1.4)*G.radius;
    var branch=(i%G.branches)/G.branches*Math.PI*2; var spin=r*G.spin;
    var rx=Math.pow(Math.random(),G.power)*(Math.random()<0.5?1:-1)*G.randomness*r;
    var ry=Math.pow(Math.random(),G.power)*(Math.random()<0.5?1:-1)*G.randomness*r*0.35;
    var rz=Math.pow(Math.random(),G.power)*(Math.random()<0.5?1:-1)*G.randomness*r;
    gpos[i*3]=Math.cos(branch+spin)*r+rx; gpos[i*3+1]=ry; gpos[i*3+2]=Math.sin(branch+spin)*r+rz;
    var col=G.inside.clone().lerp(G.outside, r/G.radius);
    gcol[i*3]=col.r; gcol[i*3+1]=col.g; gcol[i*3+2]=col.b; }
  gg.setAttribute('position',new THREE.BufferAttribute(gpos,3)); gg.setAttribute('color',new THREE.BufferAttribute(gcol,3));
  var galaxy=new THREE.Points(gg,new THREE.PointsMaterial({size:0.045,sizeAttenuation:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexColors:true,transparent:true,opacity:0.95}));
  scene.add(galaxy);
  // bright core
  var core=new THREE.Mesh(new THREE.SphereGeometry(0.35,24,24), new THREE.MeshBasicMaterial({color:0xfff0d0}));
  scene.add(core);
  var coreGlow=new THREE.PointLight(0xffd9a0,3,20,2); scene.add(coreGlow);

  // distant starfield
  var SN=1800, sg=new THREE.BufferGeometry(), sp=new Float32Array(SN*3);
  for(var s=0;s<SN;s++){ var rr=20+Math.random()*60, th=Math.random()*Math.PI*2, ph=Math.acos(Math.random()*2-1);
    sp[s*3]=rr*Math.sin(ph)*Math.cos(th); sp[s*3+1]=rr*Math.cos(ph); sp[s*3+2]=rr*Math.sin(ph)*Math.sin(th); }
  sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xbfd0ff,size:0.08,sizeAttenuation:true,transparent:true,opacity:0.7,depthWrite:false})));

  // ===== Z26 model, centred in the galaxy =====
  var loader=new THREE.GLTFLoader(); if(typeof MeshoptDecoder!=='undefined') loader.setMeshoptDecoder(MeshoptDecoder);
  var MODEL=null;
  loader.load('z26.glb', function(gltf){
    MODEL=gltf.scene;
    var box=new THREE.Box3().setFromObject(MODEL); var size=box.getSize(new THREE.Vector3());
    var maxDim=Math.max(size.x,size.y,size.z)||1; var sc=2.6/maxDim; MODEL.scale.setScalar(sc);
    box.setFromObject(MODEL); var ctr=box.getCenter(new THREE.Vector3());
    MODEL.position.sub(ctr);                       // centre the model exactly at the galaxy centre (origin)
    MODEL.traverse(function(o){ if(o.isMesh){ o.castShadow=false; if(o.material) o.material.envMapIntensity=1.2; } });
    scene.add(MODEL);
    var l=document.getElementById('load'); if(l){ l.classList.add('hide'); setTimeout(function(){ if(l.parentNode)l.parentNode.removeChild(l); },900); }
  }, function(xhr){ if(xhr&&xhr.total){ var el=document.getElementById('pct'); if(el) el.textContent=Math.round(xhr.loaded/xhr.total*100)+'%'; } },
     function(err){ fail('Modell konnte nicht geladen werden.<br><small>'+(err&&err.message?err.message:err)+'</small>'); });

  fitSize(); window.addEventListener('resize',fitSize); if(window.ResizeObserver) new ResizeObserver(fitSize).observe(canvas);
  var clock=new THREE.Clock();
  function render(){ if(canvas.width===0||canvas.height===0) fitSize();
    var dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
    galaxy.rotation.y += dt*0.06;                  // slow galaxy spin
    coreGlow.intensity = 2.6+Math.sin(t*2)*0.6;
    if(MODEL) MODEL.rotation.y += dt*0.3;          // model turns
    controls.update(); renderer.render(scene,camera);
  }
  function loop(){ requestAnimationFrame(loop); render(); } loop();
  window.__tick=function(){ render(); };
  window.__diag=function(){ var sz=new THREE.Vector2(); renderer.getSize(sz); return {size:[sz.x,sz.y],model:!!MODEL,galaxyPoints:G.count,tris:renderer.info.render.triangles}; };
})();
</script>
</body>
</html>
