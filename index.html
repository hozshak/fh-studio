<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FH STUDIO — The Clockwork</title>
<meta name="description" content="FH Studio — a mechanical clock. Click an hour to play its animation.">
<meta property="og:title" content="FH STUDIO — Clockwork"><meta property="og:type" content="website">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{ --fg:#f0e6d2; --mut:#9a8a6a; --brass:#caa14a; }
  html,body{height:100%;background:radial-gradient(120% 120% at 50% 42%,#1b160e,#070605 76%);color:var(--fg);
    font-family:"Space Grotesk",-apple-system,"Segoe UI",Georgia,serif;overflow:hidden;}
  .top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;padding:24px 34px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--mut);}
  .top b{color:var(--fg);letter-spacing:.34em;}
  .bot{position:fixed;bottom:0;left:0;right:0;z-index:5;text-align:center;padding:18px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);}
  .bot b{color:var(--brass);}

  #wrap{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(94vmin,900px);height:min(94vmin,900px);}
  svg{width:100%;height:100%;display:block;overflow:visible;}
  .gear{transform-box:fill-box;transform-origin:center;animation:spin var(--d,10s) linear infinite;}
  .gear.r{animation-name:spinR;}
  @keyframes spin{to{transform:rotate(360deg)}}@keyframes spinR{to{transform:rotate(-360deg)}}
  #gears.wind .gear{animation-duration:1.1s;}

  #nums{position:absolute;inset:0;}
  .hour{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:25px;font-weight:700;color:var(--fg);cursor:pointer;transition:transform .25s,color .25s,box-shadow .3s,background .3s;user-select:none;}
  .hour:hover,.hour.on{color:#1a140a;background:radial-gradient(circle,#e8c874,#b8892f);transform:scale(1.16);box-shadow:0 0 30px rgba(202,161,74,.7);}
  .hour small{position:absolute;bottom:-15px;font-size:8px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase;white-space:nowrap;}
  #center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
  #center .fh{font-size:22px;font-weight:700;letter-spacing:.3em;color:var(--brass);}
  #center .dig{font-size:12px;letter-spacing:.2em;color:var(--mut);margin-top:4px;font-variant-numeric:tabular-nums;}

  /* video-style player */
  #player{position:fixed;inset:0;z-index:30;background:#050405;opacity:0;pointer-events:none;transition:opacity .5s;display:flex;flex-direction:column;}
  #player.show{opacity:1;pointer-events:auto;}
  #pcanvas{flex:1;width:100%;display:block;}
  #bar{position:absolute;left:0;right:0;bottom:0;padding:18px 26px;display:flex;align-items:center;gap:16px;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);}
  #bar .prog{flex:1;height:3px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden;cursor:pointer;}
  #bar .prog i{display:block;height:100%;width:0;background:var(--brass);}
  #bar button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:20px;padding:7px 16px;font:600 11px/1 inherit;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;}
  #bar button:hover{border-color:var(--brass);color:var(--brass);}
  #bar .tt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#cbb78a;min-width:120px;}
  #pclose{position:absolute;top:22px;right:26px;z-index:2;color:#fff;font-size:12px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:8px 18px;}
  #pclose:hover{border-color:var(--brass);color:var(--brass);}
</style>
</head>
<body>
<div class="top"><span><b>FH&nbsp;STUDIO</b> — The Clockwork</span><span>Est. 2026</span></div>

<div id="wrap">
  <svg id="clock" viewBox="-500 -500 1000 1000">
    <defs>
      <radialGradient id="brass" cx="38%" cy="30%" r="80%"><stop offset="0%" stop-color="#f4dd9a"/><stop offset="42%" stop-color="#caa14a"/><stop offset="78%" stop-color="#8a6a2a"/><stop offset="100%" stop-color="#4e3a16"/></radialGradient>
      <radialGradient id="steel" cx="38%" cy="30%" r="80%"><stop offset="0%" stop-color="#dfe6ef"/><stop offset="45%" stop-color="#9aa4b2"/><stop offset="80%" stop-color="#5b6472"/><stop offset="100%" stop-color="#2c323b"/></radialGradient>
      <radialGradient id="dialg" cx="50%" cy="42%" r="62%"><stop offset="0%" stop-color="#161109"/><stop offset="100%" stop-color="#050403"/></radialGradient>
      <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/></filter>
    </defs>
    <g id="gears" filter="url(#sh)"></g>
    <circle r="336" fill="url(#dialg)" stroke="#3a2c14" stroke-width="5"/>
    <circle r="336" fill="none" stroke="rgba(202,161,74,.35)" stroke-width="1.5"/>
    <g id="ticks"></g>
    <g id="hands">
      <line id="hh" x1="0" y1="34" x2="0" y2="-196" stroke="#e8d9b0" stroke-width="12" stroke-linecap="round"/>
      <line id="mh" x1="0" y1="44" x2="0" y2="-276" stroke="#f0e6d2" stroke-width="7" stroke-linecap="round"/>
      <line id="sh" x1="0" y1="76" x2="0" y2="-306" stroke="#caa14a" stroke-width="3" stroke-linecap="round"/>
      <circle r="15" fill="url(#brass)" stroke="#3a2c14" stroke-width="3"/>
    </g>
  </svg>
  <div id="nums"></div>
  <div id="center"><div class="fh">FH</div><div class="dig" id="dig">00:00:00</div></div>
</div>

<div class="bot">Click an <b>hour</b> — play its animation</div>

<div id="player">
  <canvas id="pcanvas"></canvas>
  <div id="pclose">Close ✕</div>
  <div id="bar"><span class="tt" id="ptt">01 · First Light</span><span class="prog" id="pprog"><i></i></span><button id="preplay">Replay</button></div>
</div>

<script>
(function(){
  var svgNS="http://www.w3.org/2000/svg";
  function xy(r,a){ return (Math.cos(a)*r).toFixed(2)+','+(Math.sin(a)*r).toFixed(2); }
  function gearPathStr(teeth,rTip,rRoot){ var step=Math.PI*2/teeth, tb=step*0.34, tt=step*0.17, p='';
    for(var i=0;i<teeth;i++){ var a=i*step; p+=(i===0?'M':'L')+xy(rRoot,a-tb)+' L'+xy(rTip,a-tt)+' L'+xy(rTip,a+tt)+' L'+xy(rRoot,a+tb); }
    return p+' Z'; }
  function svgGear(teeth,rTip,rRoot,rHub,grad){ var g=document.createElementNS(svgNS,'g');
    var pa=document.createElementNS(svgNS,'path'); pa.setAttribute('d',gearPathStr(teeth,rTip,rRoot)); pa.setAttribute('fill',grad); pa.setAttribute('stroke','#2c2110'); pa.setAttribute('stroke-width','2'); pa.setAttribute('stroke-linejoin','round'); g.appendChild(pa);
    var rim=document.createElementNS(svgNS,'circle'); rim.setAttribute('r',rRoot*0.9); rim.setAttribute('fill','none'); rim.setAttribute('stroke','rgba(255,244,210,.25)'); rim.setAttribute('stroke-width',rRoot*0.05); g.appendChild(rim);
    var hub=document.createElementNS(svgNS,'circle'); hub.setAttribute('r',rHub); hub.setAttribute('fill','#0e0b06'); hub.setAttribute('stroke','#2c2110'); hub.setAttribute('stroke-width','3'); g.appendChild(hub);
    var hub2=document.createElementNS(svgNS,'circle'); hub2.setAttribute('r',rHub*0.5); hub2.setAttribute('fill',grad); hub2.setAttribute('stroke','#2c2110'); hub2.setAttribute('stroke-width','2'); g.appendChild(hub2);
    for(var b=0;b<6;b++){ var bo=document.createElementNS(svgNS,'circle'); var ang=b*60*Math.PI/180; bo.setAttribute('cx',Math.cos(ang)*rHub*0.72); bo.setAttribute('cy',Math.sin(ang)*rHub*0.72); bo.setAttribute('r',rHub*0.12); bo.setAttribute('fill','#241a0c'); g.appendChild(bo); }
    return g; }
  var GEARS=document.getElementById('gears');
  function place(x,y,teeth,rTip,rRoot,rHub,grad,dur,rev){ var w=document.createElementNS(svgNS,'g'); w.setAttribute('transform','translate('+x+','+y+')');
    var g=svgGear(teeth,rTip,rRoot,rHub,grad); g.setAttribute('class','gear'+(rev?' r':'')); g.style.setProperty('--d',dur+'s'); w.appendChild(g); GEARS.appendChild(w); }
  // a meshing-ish train: big centre + counter-rotating satellites (speed ∝ teeth)
  place(0,0, 54, 300,270,72,'url(#brass)', 54,false);
  place(-278,-278, 18,110,86,30,'url(#steel)', 18,true);
  place(300,-250, 24,142,116,38,'url(#brass)', 24,false);
  place(320,250, 16,100,78,26,'url(#steel)', 16,true);
  place(-300,270, 22,130,104,34,'url(#brass)', 22,false);
  place(70,-360, 12,76,58,20,'url(#steel)', 12,true);
  place(-130,350, 14,86,66,22,'url(#brass)', 14,false);

  var ticks=document.getElementById('ticks');
  for(var i=0;i<60;i++){ var a=i*6*Math.PI/180, big=(i%5===0), r1=big?296:308, r2=324;
    var l=document.createElementNS(svgNS,'line'); l.setAttribute('x1',Math.sin(a)*r1); l.setAttribute('y1',-Math.cos(a)*r1); l.setAttribute('x2',Math.sin(a)*r2); l.setAttribute('y2',-Math.cos(a)*r2); l.setAttribute('stroke',big?'#caa14a':'#5a4a2a'); l.setAttribute('stroke-width',big?4:2); ticks.appendChild(l); }

  var TITLES=["First Light","The Meeting","Warm-Up","Structure","Motion","Depth","High Noon","Precision","Polish","Launch","Feedback","Midnight"];
  var COLORS=["#ffb347","#7ad1ff","#ff7ad0","#9b8cff","#4fe0c0","#ffd36b","#ff6b6b","#8affc0","#c8a978","#6d9bff","#ff9de0","#5b6bff"];
  var nums=document.getElementById('nums');
  for(var h=1;h<=12;h++){ var ang=(h/12)*2*Math.PI - Math.PI/2; var el=document.createElement('div'); el.className='hour';
    el.style.left=(50+Math.cos(ang)*41)+'%'; el.style.top=(50+Math.sin(ang)*41)+'%'; el.setAttribute('data-h',h);
    el.innerHTML=h+'<small>'+TITLES[h-1]+'</small>'; el.addEventListener('click',(function(x){return function(){ openHour(x); };})(h)); nums.appendChild(el); }

  // ===== video-style animation player (canvas) =====
  var player=document.getElementById('player'), pc=document.getElementById('pcanvas'), ctx=pc.getContext('2d');
  var prog=document.querySelector('#pprog i'), ptt=document.getElementById('ptt');
  var cur=1, playT=0, playing=false, DURA=6.5, W=0, Hh=0, dpr=Math.min(devicePixelRatio,2), parts=[];
  function psize(){ W=pc.clientWidth; Hh=pc.clientHeight; pc.width=W*dpr; pc.height=Hh*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  function hexToRgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
  function canvasGear(cx,cy,rTip,rRoot,teeth,ang,col){ ctx.save(); ctx.translate(cx,cy); ctx.rotate(ang); ctx.beginPath();
    var step=Math.PI*2/teeth, tb=step*0.34, tt=step*0.17;
    for(var i=0;i<teeth;i++){ var a=i*step; var pts=[[rRoot,a-tb],[rTip,a-tt],[rTip,a+tt],[rRoot,a+tb]];
      for(var k=0;k<4;k++){ var px=Math.cos(pts[k][1])*pts[k][0], py=Math.sin(pts[k][1])*pts[k][0]; if(i===0&&k===0)ctx.moveTo(px,py); else ctx.lineTo(px,py); } }
    ctx.closePath();
    var g=ctx.createRadialGradient(-rTip*0.3,-rTip*0.3,rTip*0.1,0,0,rTip); g.addColorStop(0,col); g.addColorStop(0.6,shade(col,-0.25)); g.addColorStop(1,shade(col,-0.6));
    ctx.fillStyle=g; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,rRoot*0.32,0,7); ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fill(); ctx.restore(); }
  function shade(hex,f){ var c=hexToRgb(hex); return 'rgb('+c.map(function(v){ v=f<0?v*(1+f):v+(255-v)*f; return Math.max(0,Math.min(255,v|0)); }).join(',')+')'; }

  function frame(){ if(!playing) return; playT+=1/60; var t=playT, col=COLORS[cur-1], tl=TITLES[cur-1];
    var k=Math.min(1,t/DURA); prog.style.width=(k*100)+'%';
    // bg
    var rg=ctx.createRadialGradient(W/2,Hh/2,0,W/2,Hh/2,Math.max(W,Hh)*0.7); rg.addColorStop(0,shade(col,-0.55)); rg.addColorStop(1,'#050405'); ctx.fillStyle=rg; ctx.fillRect(0,0,W,Hh);
    // particles
    for(var i=0;i<parts.length;i++){ var p=parts[i]; p.a+=p.s*0.01; var x=W/2+Math.cos(p.a)*p.r, y=Hh/2+Math.sin(p.a)*p.r*0.6;
      ctx.globalAlpha=0.5*Math.min(1,t*1.5)*p.o; ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,p.z,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    // central gears assembling + spinning
    var sc=0.4+Math.min(1,t*0.9)*0.6, base=Math.min(W,Hh);
    canvasGear(W/2,Hh/2, base*0.20*sc, base*0.17*sc, 40, t*0.6, col);
    canvasGear(W/2 - base*0.22*sc, Hh/2 - base*0.05, base*0.09*sc, base*0.072*sc, 16, -t*1.4, shade(col,0.15));
    canvasGear(W/2 + base*0.20*sc, Hh/2 + base*0.12, base*0.07*sc, base*0.055*sc, 12, -t*1.8, shade(col,0.1));
    // light sweep
    var sweep=((t*0.5)%1); var lg=ctx.createLinearGradient(sweep*W-200,0,sweep*W+200,0); lg.addColorStop(0,'rgba(255,255,255,0)'); lg.addColorStop(0.5,'rgba(255,255,255,.10)'); lg.addColorStop(1,'rgba(255,255,255,0)'); ctx.fillStyle=lg; ctx.fillRect(0,0,W,Hh);
    // title
    var ta=Math.max(0,Math.min(1,(t-0.4)*1.4)); ctx.globalAlpha=ta;
    ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='700 '+Math.round(base*0.11)+'px "Space Grotesk",sans-serif';
    ctx.fillText(String(cur).padStart(2,'0'), W/2, Hh*0.30 + (1-ta)*20);
    ctx.font='600 '+Math.round(base*0.045)+'px "Space Grotesk",sans-serif'; ctx.fillStyle=col; ctx.fillText(tl.toUpperCase(), W/2, Hh*0.80);
    ctx.globalAlpha=0.7; ctx.fillStyle='#cbb78a'; ctx.font='500 '+Math.round(base*0.02)+'px "Space Grotesk",sans-serif'; ctx.fillText('HOUR '+String(cur).padStart(2,'0')+' — FH STUDIO', W/2, Hh*0.86);
    ctx.globalAlpha=1;
    // vignette
    var vg=ctx.createRadialGradient(W/2,Hh/2,base*0.3,W/2,Hh/2,Math.max(W,Hh)*0.7); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.55)'); ctx.fillStyle=vg; ctx.fillRect(0,0,W,Hh);
    if(t<DURA) requestAnimationFrame(frame); else { playing=false; }
  }
  function startClip(h){ cur=h; psize(); parts=[]; for(var i=0;i<70;i++) parts.push({a:Math.random()*7,r:80+Math.random()*(Math.max(W,Hh)*0.5),s:0.4+Math.random(),z:1+Math.random()*2.5,o:0.4+Math.random()*0.6});
    playT=0; playing=true; ptt.textContent=String(h).padStart(2,'0')+' · '+TITLES[h-1]; requestAnimationFrame(frame); }

  function openHour(h){ document.querySelectorAll('.hour').forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-h')===h); });
    GEARS.classList.add('wind'); setTimeout(function(){ GEARS.classList.remove('wind'); },1200);
    player.classList.add('show'); startClip(h); }
  function closeP(){ player.classList.remove('show'); playing=false; document.querySelectorAll('.hour').forEach(function(e){ e.classList.remove('on'); }); }
  document.getElementById('pclose').addEventListener('click',closeP);
  document.getElementById('preplay').addEventListener('click',function(){ startClip(cur); });
  document.getElementById('pprog').addEventListener('click',function(e){ var r=this.getBoundingClientRect(); playT=DURA*((e.clientX-r.left)/r.width); if(!playing){playing=true;requestAnimationFrame(frame);} });
  addEventListener('keydown',function(e){ if(e.key==='Escape')closeP(); });
  addEventListener('resize',function(){ if(player.classList.contains('show'))psize(); });

  // live time
  var hh=document.getElementById('hh'), mh=document.getElementById('mh'), sh=document.getElementById('sh'), dig=document.getElementById('dig');
  function upd(){ var d=new Date(),s=d.getSeconds(),m=d.getMinutes(),hr=d.getHours();
    hh.setAttribute('transform','rotate('+((hr%12)+m/60)*30+')'); mh.setAttribute('transform','rotate('+(m+s/60)*6+')'); sh.setAttribute('transform','rotate('+s*6+')');
    dig.textContent=[hr,m,s].map(function(n){return String(n).padStart(2,'0');}).join(':'); }
  upd(); setInterval(upd,1000);

  window.__diag=function(){ return {gears:GEARS.querySelectorAll('.gear').length,hours:document.querySelectorAll('.hour').length,ticks:ticks.children.length,playerOpen:player.classList.contains('show'),playing:playing,progress:prog.style.width,time:dig.textContent}; };
  window.__openHour=function(h){ openHour(h); for(var i=0;i<60;i++) if(playing) frame===frame; return window.__diag(); };
  window.__frame=function(n){ for(var i=0;i<(n||1);i++){ if(playing) frame(); } return {playT:+playT.toFixed(2)}; };
})();
</script>
</body>
</html>
