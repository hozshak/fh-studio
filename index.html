<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FH STUDIO — Hozan Shaker × Fynn Beckmann</title>
<meta name="description" content="FH Studio — an independent web design studio by Hozan Shaker & Fynn Beckmann. Premium, immersive, interactive websites.">
<meta property="og:title" content="FH STUDIO"><meta property="og:description" content="Independent web design studio · Hozan Shaker × Fynn Beckmann"><meta property="og:type" content="website">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{ --bg:#06070d; --fg:#f4f5fb; --mut:#8b90b0; --accent:#8a7bff; }
  html,body{height:100%;width:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:"Space Grotesk",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;cursor:none;}
  #c{position:fixed;inset:0;display:block;width:100vw;height:100vh;z-index:1;}

  /* hero overlay */
  .hero{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;text-align:center;}
  .eyebrow{font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--mut);
    opacity:0;transform:translateY(14px);animation:rise .9s .2s cubic-bezier(.2,.7,.2,1) forwards;}
  h1{font-size:clamp(48px,13vw,180px);font-weight:700;line-height:.92;letter-spacing:-.02em;margin:14px 0 18px;display:flex;gap:.06em;}
  h1 .ch{display:inline-block;transform:translateY(115%);animation:chrise 1s cubic-bezier(.16,1,.3,1) forwards;}
  .sub{font-size:clamp(12px,1.5vw,16px);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);
    opacity:0;transform:translateY(14px);animation:rise .9s 1.05s cubic-bezier(.2,.7,.2,1) forwards;}
  @keyframes chrise{to{transform:translateY(0)}}
  @keyframes rise{to{opacity:1;transform:none}}

  /* top + bottom bars */
  .bar{position:fixed;left:0;right:0;z-index:3;display:flex;justify-content:space-between;padding:26px 34px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);pointer-events:none;}
  .bar.top{top:0;} .bar.bot{bottom:0;}
  .bar .lo{color:var(--fg);font-weight:600;letter-spacing:.28em;}
  .scrollhint{display:flex;align-items:center;gap:10px;}
  .scrollhint .ln{width:46px;height:1px;background:linear-gradient(90deg,var(--mut),transparent);animation:slide 2s infinite;}
  @keyframes slide{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}

  /* custom cursor */
  .dot,.ring{position:fixed;top:0;left:0;z-index:50;border-radius:50%;pointer-events:none;mix-blend-mode:difference;}
  .dot{width:6px;height:6px;background:#fff;margin:-3px 0 0 -3px;}
  .ring{width:38px;height:38px;border:1px solid rgba(255,255,255,.55);margin:-19px 0 0 -19px;transition:width .25s,height .25s,margin .25s,border-color .25s;}

  #err{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;color:#ff8a8a;font-size:14px;line-height:1.6;cursor:auto;}
  @media (prefers-reduced-motion: reduce){ .ch,.eyebrow,.sub{animation-duration:.01ms!important;opacity:1;transform:none;} .scrollhint .ln{animation:none;} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="bar top"><span class="lo">FH&nbsp;STUDIO</span><span>Est. 2026</span></div>

<div class="hero">
  <div class="eyebrow">Independent Web Design Studio</div>
  <h1 id="title" aria-label="FH STUDIO"></h1>
  <div class="sub">Hozan Shaker &nbsp;×&nbsp; Fynn Beckmann</div>
</div>

<div class="bar bot">
  <span>Premium · Immersive · Interactive</span>
  <span class="scrollhint">Scroll <span class="ln"></span></span>
</div>

<div class="dot" id="dot"></div><div class="ring" id="ring"></div>
<div id="err"></div>

<script src="three.min.js"></script>
<script>
(function(){
  // ---- kinetic title (split into letters) ----
  var word="FH STUDIO", el=document.getElementById('title');
  for(var i=0;i<word.length;i++){ var s=document.createElement('span'); s.className='ch';
    s.textContent = word[i]===' ' ? ' ' : word[i]; s.style.animationDelay=(0.35+i*0.055)+'s'; el.appendChild(s); }

  // ---- custom cursor ----
  var dot=document.getElementById('dot'), ring=document.getElementById('ring'), rx=innerWidth/2, ry=innerHeight/2, tx=rx, ty=ry, mx=0, my=0;
  addEventListener('mousemove',function(e){ tx=e.clientX; ty=e.clientY; dot.style.transform='translate('+tx+'px,'+ty+'px)';
    mx=(e.clientX/innerWidth-0.5); my=(e.clientY/innerHeight-0.5); });
  (function cur(){ rx+=(tx-rx)*0.18; ry+=(ty-ry)*0.18; ring.style.transform='translate('+rx+'px,'+ry+'px)'; requestAnimationFrame(cur); })();

  function fail(m){ var e=document.getElementById('err'); e.style.display='flex'; e.innerHTML=m; }
  if(typeof THREE==='undefined'){ fail('Three.js nicht geladen.'); return; }

  var canvas=document.getElementById('c'), renderer;
  try{ renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true,preserveDrawingBuffer:true}); }
  catch(e){ fail('Kein WebGL — bitte Chrome/Edge.'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15;
  if(renderer.outputColorSpace!==undefined) renderer.outputColorSpace=THREE.SRGBColorSpace; else renderer.outputEncoding=THREE.sRGBEncoding;

  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(42, 1, 0.1, 100); camera.position.set(0,0,6);
  function fitSize(){ var w=canvas.clientWidth||innerWidth||1280, h=canvas.clientHeight||innerHeight||720; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }

  // iridescent gradient environment
  var ecv=document.createElement('canvas'); ecv.width=128; ecv.height=512; var ex=ecv.getContext('2d');
  var eg=ex.createLinearGradient(0,0,0,512);
  eg.addColorStop(0,'#06070d'); eg.addColorStop(0.35,'#2a2f7a'); eg.addColorStop(0.55,'#8a7bff'); eg.addColorStop(0.72,'#ff7bd5'); eg.addColorStop(0.9,'#3df0d0'); eg.addColorStop(1,'#06070d');
  ex.fillStyle=eg; ex.fillRect(0,0,128,512);
  var etex=new THREE.CanvasTexture(ecv); etex.mapping=THREE.EquirectangularReflectionMapping;
  var pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromEquirectangular(etex).texture; etex.dispose();

  scene.add(new THREE.AmbientLight(0xffffff,0.25));
  var l1=new THREE.DirectionalLight(0xbcd0ff,2.6); l1.position.set(5,6,4); scene.add(l1);
  var l2=new THREE.DirectionalLight(0xff8ad8,2.0); l2.position.set(-6,-2,2); scene.add(l2);

  // the centrepiece — iridescent metallic form with flowing noise displacement
  var geo=new THREE.IcosahedronGeometry(1.5, 64);
  var mat=new THREE.MeshPhysicalMaterial({ color:0xeef0ff, metalness:0.6, roughness:0.14, clearcoat:1, clearcoatRoughness:0.18, envMapIntensity:2.6 });
  if('iridescence' in mat){ mat.iridescence=1; mat.iridescenceIOR=1.5; mat.iridescenceThicknessRange=[120,520]; }
  var U={uT:{value:0},uAmp:{value:0.28}};
  mat.onBeforeCompile=function(sh){ sh.uniforms.uT=U.uT; sh.uniforms.uAmp=U.uAmp;
    sh.vertexShader='uniform float uT;uniform float uAmp;\n'+
      'vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}\n'+
      'float snoise(vec3 v){const vec2 C=vec2(1.0/6.0,1.0/3.0);const vec4 D=vec4(0.0,0.5,1.0,2.0);vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.0-g;vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;i=mod289(i);vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));float n_=0.142857142857;vec3 ns=n_*D.wyz-D.xzx;vec4 j=p-49.0*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.0*x_);vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.0-abs(x)-abs(y);vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);vec4 s0=floor(b0)*2.0+1.0;vec4 s1=floor(b1)*2.0+1.0;vec4 sh2=-step(h,vec4(0.0));vec4 a0=b0.xzyw+s0.xzyw*sh2.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh2.zzww;vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);vec4 nrm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));p0*=nrm.x;p1*=nrm.y;p2*=nrm.z;p3*=nrm.w;vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);m=m*m;return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));}\n'+sh.vertexShader;
    sh.vertexShader=sh.vertexShader.replace('#include <begin_vertex>',
      '#include <begin_vertex>\n float nz=snoise(normalize(position)*1.2+vec3(uT*0.2));\n float nz2=snoise(normalize(position)*2.6-vec3(uT*0.15));\n transformed += normal*(nz*uAmp + nz2*uAmp*0.45);'); };
  var blob=new THREE.Mesh(geo,mat); scene.add(blob);

  // faint sparkle particles around it
  var PN=350, pg=new THREE.BufferGeometry(), pp=new Float32Array(PN*3);
  for(var p=0;p<PN;p++){ var r=2.2+Math.random()*3, a=Math.random()*6.283, b=Math.acos(Math.random()*2-1);
    pp[p*3]=r*Math.sin(b)*Math.cos(a); pp[p*3+1]=r*Math.cos(b); pp[p*3+2]=r*Math.sin(b)*Math.sin(a); }
  pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
  var spark=new THREE.Points(pg,new THREE.PointsMaterial({color:0x9fb4ff,size:0.03,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending,depthWrite:false}));
  scene.add(spark);

  fitSize(); addEventListener('resize',fitSize); if(window.ResizeObserver) new ResizeObserver(fitSize).observe(canvas);
  var clock=new THREE.Clock(), curX=0, curY=0;
  function render(){ if(canvas.width===0||canvas.height===0) fitSize();
    var dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime; U.uT.value=t;
    curX+=(mx-curX)*0.05; curY+=(my-curY)*0.05;
    blob.rotation.y += dt*0.18; blob.rotation.x = curY*0.6; blob.rotation.z = curX*0.3;
    blob.position.x = curX*0.7; blob.position.y = -curY*0.5;
    var s=1+Math.sin(t*0.7)*0.03; blob.scale.setScalar(s);
    spark.rotation.y = t*0.03;
    camera.position.x += (curX*0.8 - camera.position.x)*0.05; camera.position.y += (-curY*0.6 - camera.position.y)*0.05; camera.lookAt(0,0,0);
    renderer.render(scene,camera);
  }
  function loop(){ requestAnimationFrame(loop); render(); } loop();

  // hover state on interactive zones (whole hero text)
  document.querySelectorAll('h1,.sub').forEach(function(z){ });

  window.__tick=function(){ render(); };
  window.__sample=function(){ var gl=renderer.getContext(); var w=canvas.width,h=canvas.height; var px=new Uint8Array(400); gl.readPixels((w*0.5)|0,(h*0.5)|0,10,10,gl.RGBA,gl.UNSIGNED_BYTE,px); var r=0,g=0,b=0,mn=999,mx2=0; for(var i=0;i<100;i++){var L=px[i*4]+px[i*4+1]+px[i*4+2];mn=Math.min(mn,L);mx2=Math.max(mx2,L);r+=px[i*4];g+=px[i*4+1];b+=px[i*4+2];} return {r:(r/100)|0,g:(g/100)|0,b:(b/100)|0,contrast:mx2-mn}; };
})();
</script>
</body>
</html>
