<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FH STUDIO — Galaxy Map</title>
<meta name="description" content="FH Studio — chart a course across the galaxy. Select a world to plot a route from Earth.">
<meta property="og:title" content="FH STUDIO — Galaxy"><meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{ --fg:#dfe8ff; --mut:#7f8db0; --cy:#57e6ff; --gold:#ffcf6b; }
  html,body{height:100%;background:#02030a;color:var(--fg);font-family:"Space Grotesk",-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;}
  #c{position:fixed;inset:0;display:block;width:100vw;height:100vh;z-index:0;cursor:grab;}
  #c:active{cursor:grabbing;}
  #labels{position:fixed;inset:0;z-index:2;pointer-events:none;}

  /* object label / hotspot */
  .lab{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;user-select:none;
    display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:12px;letter-spacing:.04em;color:var(--fg);
    padding:5px 4px;transition:opacity .3s;}
  .lab .dot{width:9px;height:9px;border-radius:50%;background:var(--c,#9fb4ff);box-shadow:0 0 12px var(--c,#9fb4ff);flex:none;position:relative;transition:transform .25s;}
  .lab .nm{opacity:.0;transform:translateX(-4px);transition:.25s;}
  .lab:hover .nm,.lab.sel .nm,.lab.big .nm{opacity:1;transform:none;}
  .lab:hover .dot,.lab.sel .dot{transform:scale(1.5);}
  .lab .ty{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);}
  .lab.earth{color:var(--cy);} .lab.earth .dot{background:var(--cy);box-shadow:0 0 16px var(--cy);}
  .lab.station .dot{width:0;height:0;border:none;background:none;box-shadow:none;}
  .lab.station:before{content:"▣";color:var(--gold);font-size:12px;text-shadow:0 0 10px var(--gold);}
  /* select ring */
  .lab .ring{position:absolute;left:4.5px;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity .2s;}
  .lab.sel .ring{opacity:1;}
  .lab .ring circle{fill:none;stroke-width:2.5;}
  .lab .ring .bg{stroke:rgba(255,255,255,.15);}
  .lab .ring .fg{stroke:var(--cy);stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;}

  /* HUD */
  .hud{position:fixed;z-index:5;color:var(--mut);}
  .top{top:26px;left:30px;} .top .t{font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:var(--fg);font-weight:700;}
  .top .s{font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-top:6px;}
  .tr{top:26px;right:30px;text-align:right;font-size:11px;letter-spacing:.18em;text-transform:uppercase;}
  .bl{bottom:26px;left:30px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;}
  .bl b{color:var(--cy);}
  /* target panel */
  #panel{position:fixed;z-index:5;right:30px;bottom:28px;width:min(320px,80vw);background:linear-gradient(180deg,rgba(10,16,34,.82),rgba(6,9,20,.82));
    border:1px solid rgba(87,230,255,.28);border-radius:14px;padding:20px 22px;backdrop-filter:blur(8px);
    opacity:0;transform:translateY(16px);transition:.5s cubic-bezier(.16,1,.3,1);}
  #panel.show{opacity:1;transform:none;}
  #panel .k{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--cy);}
  #panel h2{font-size:24px;font-weight:700;margin-top:6px;}
  #panel .ty2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:2px;}
  #panel .grid{display:flex;gap:22px;margin-top:16px;}
  #panel .grid div span{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);}
  #panel .grid div b{font-size:16px;font-variant-numeric:tabular-nums;}
  #panel .st{margin-top:16px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);}
  #panel .st.locked{color:var(--cy);}
  #load{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#02030a;transition:opacity .8s;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--cy);}
  #load.hide{opacity:0;pointer-events:none;}
  #err{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;color:#ff8a8a;font-size:14px;text-align:center;padding:30px;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<div class="hud top"><div class="t">FH&nbsp;STUDIO</div><div class="s">Galaxy Map · Sol Sector</div></div>
<div class="hud tr">Drag to look · Scroll to zoom<br>Select a world to plot a route</div>
<div class="hud bl">Origin: <b>Earth</b> · <span id="cnt">0</span> worlds detected</div>

<div id="panel">
  <div class="k" id="pk">Target locked</div>
  <h2 id="pnm">—</h2>
  <div class="ty2" id="pty">—</div>
  <div class="grid"><div><span>Distance</span><b id="pdist">—</b></div><div><span>Class</span><b id="pcls">—</b></div><div><span>Route</span><b id="prt">—</b></div></div>
  <div class="st" id="pst">Charging jump…</div>
</div>

<div id="load">Scanning the galaxy…</div>
<div id="err"></div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
(function(){
  function fail(m){ document.getElementById('err').style.display='flex'; document.getElementById('err').innerHTML=m; document.getElementById('load').classList.add('hide'); }
  if(typeof THREE==='undefined'){ fail('Three.js not loaded.'); return; }
  var canvas=document.getElementById('c'), renderer;
  try{ renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true}); }catch(e){ fail('WebGL unavailable — please use Chrome/Edge.'); return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.1;
  if(renderer.outputColorSpace!==undefined) renderer.outputColorSpace=THREE.SRGBColorSpace; else renderer.outputEncoding=THREE.sRGBEncoding;

  var scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x02030a,0.0016);
  var camera=new THREE.PerspectiveCamera(50,1,0.1,4000); camera.position.set(0,26,120);
  function fit(){ var w=canvas.clientWidth||innerWidth,h=canvas.clientHeight||innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
  var controls=new THREE.OrbitControls(camera,canvas); controls.enableDamping=true; controls.dampingFactor=0.06; controls.minDistance=30; controls.maxDistance=460; controls.autoRotate=true; controls.autoRotateSpeed=0.18;

  scene.add(new THREE.AmbientLight(0x8899cc,0.6));
  var sun=new THREE.PointLight(0xffffff,2.2,0,1.4); sun.position.set(60,80,60); scene.add(sun);

  // ---- galaxy: starfield ----
  function stars(n,spread,size,col){ var g=new THREE.BufferGeometry(),p=new Float32Array(n*3),c=new Float32Array(n*3),base=new THREE.Color(col);
    for(var i=0;i<n;i++){ var r=spread*(0.3+Math.random()*0.7), th=Math.random()*6.283, ph=Math.acos(Math.random()*2-1);
      p[i*3]=r*Math.sin(ph)*Math.cos(th); p[i*3+1]=r*Math.cos(ph)*0.5; p[i*3+2]=r*Math.sin(ph)*Math.sin(th);
      var t=Math.random(); var cc=base.clone().offsetHSL((Math.random()-0.5)*0.1,0,(Math.random()-0.5)*0.4); c[i*3]=cc.r;c[i*3+1]=cc.g;c[i*3+2]=cc.b; }
    g.setAttribute('position',new THREE.BufferAttribute(p,3)); g.setAttribute('color',new THREE.BufferAttribute(c,3));
    return new THREE.Points(g,new THREE.PointsMaterial({size:size,vertexColors:true,transparent:true,opacity:0.9,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true})); }
  scene.add(stars(6000,2400,2.2,0xbfd0ff));
  scene.add(stars(1400,900,3.4,0x8a7bff));
  // nebula clouds (soft additive sprites)
  function nebulaTex(){ var cv=document.createElement('canvas'); cv.width=cv.height=128; var x=cv.getContext('2d'); var g=x.createRadialGradient(64,64,0,64,64,64); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.3,'rgba(180,190,255,.5)'); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=g; x.fillRect(0,0,128,128); return new THREE.CanvasTexture(cv); }
  var ntex=nebulaTex(), nebCol=[0x5b3fb0,0x2a5cc0,0xb0407a,0x2f8f9a];
  for(var nb=0;nb<14;nb++){ var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:ntex,color:nebCol[nb%4],transparent:true,opacity:0.16,blending:THREE.AdditiveBlending,depthWrite:false}));
    sp.position.set((Math.random()-0.5)*900,(Math.random()-0.5)*300,(Math.random()-0.5)*900); sp.scale.setScalar(180+Math.random()*260); scene.add(sp); }

  // ---- Earth (origin) ----
  var earth=new THREE.Mesh(new THREE.SphereGeometry(7,48,48), new THREE.MeshStandardMaterial({color:0x2a6cc4,emissive:0x0a2a55,emissiveIntensity:0.5,roughness:0.7,metalness:0.1}));
  scene.add(earth);
  var atmo=new THREE.Mesh(new THREE.SphereGeometry(8.4,48,48), new THREE.MeshBasicMaterial({color:0x57e6ff,transparent:true,opacity:0.12,side:THREE.BackSide})); scene.add(atmo);
  var EARTH_POS=new THREE.Vector3(0,0,0);

  // ---- worlds + stations ----
  var WORLDS=[
    {n:"Aurelia",t:"Lush world",cls:"E-class",c:0x6ee27a,r:5.2},
    {n:"Vexis Prime",t:"Toxic world",cls:"T-class",c:0xb06cff,r:6.0},
    {n:"Korrindar",t:"Desert world",cls:"D-class",c:0xffab5c,r:5.6},
    {n:"Nyx-9",t:"Frozen world",cls:"F-class",c:0x7fdfff,r:4.6},
    {n:"Hesperon",t:"Gas giant",cls:"G-class",c:0xd9b98a,r:9.0},
    {n:"Thal'Vaan",t:"Ocean world",cls:"O-class",c:0x4aa6ff,r:5.8},
    {n:"Ember IV",t:"Volcanic world",cls:"V-class",c:0xff6a4a,r:5.0},
    {n:"Solace",t:"Paradise world",cls:"P-class",c:0x59e6c0,r:5.4}
  ];
  var STATIONS=[ {n:"Anvil Station",t:"Trade hub"}, {n:"Meridian Outpost",t:"Waypoint"}, {n:"Drift Terminal",t:"Refuel"} ];

  var OBJ=[]; // {data,mesh,pos,type}
  function seedPos(i,total,rad){ var ph=Math.acos(1-2*(i+0.5)/total), th=Math.PI*(1+Math.sqrt(5))*i; return new THREE.Vector3(Math.sin(ph)*Math.cos(th),Math.cos(ph)*0.6,Math.sin(ph)*Math.sin(th)).multiplyScalar(rad); }
  WORLDS.forEach(function(w,i){ var pos=seedPos(i,WORLDS.length,60+i*14 % 90 + 40).setY((Math.random()-0.5)*70);
    pos=new THREE.Vector3((Math.random()-0.5)*2,(Math.random()-0.5)*0.7,(Math.random()-0.5)*2).normalize().multiplyScalar(55+Math.random()*120);
    var m=new THREE.Mesh(new THREE.SphereGeometry(w.r,32,32), new THREE.MeshStandardMaterial({color:w.c,emissive:w.c,emissiveIntensity:0.35,roughness:0.6,metalness:0.15}));
    m.position.copy(pos); scene.add(m);
    var glow=new THREE.Sprite(new THREE.SpriteMaterial({map:ntex,color:w.c,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false})); glow.scale.setScalar(w.r*5); m.add(glow);
    OBJ.push({data:w,mesh:m,pos:pos,type:'world'}); });
  STATIONS.forEach(function(s,i){ var pos=new THREE.Vector3((Math.random()-0.5)*2,(Math.random()-0.5)*0.9,(Math.random()-0.5)*2).normalize().multiplyScalar(40+Math.random()*90);
    var g=new THREE.Group(); var ring=new THREE.Mesh(new THREE.TorusGeometry(3.4,0.5,8,24),new THREE.MeshStandardMaterial({color:0xffcf6b,emissive:0xffcf6b,emissiveIntensity:0.6,metalness:0.8,roughness:0.3})); g.add(ring);
    var core=new THREE.Mesh(new THREE.OctahedronGeometry(1.6,0),new THREE.MeshStandardMaterial({color:0xfff0cf,emissive:0xffcf6b,emissiveIntensity:0.5})); g.add(core);
    g.position.copy(pos); g.userData.spin=ring; scene.add(g);
    OBJ.push({data:s,mesh:g,pos:pos,type:'station'}); });
  document.getElementById('cnt').textContent=WORLDS.length;

  // ---- route line (Earth → target) ----
  var routeGeo=new THREE.BufferGeometry(); routeGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(6),3));
  var route=new THREE.Line(routeGeo,new THREE.LineBasicMaterial({color:0x57e6ff,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending})); route.visible=false; scene.add(route);
  var routeDot=new THREE.Mesh(new THREE.SphereGeometry(1.1,12,12),new THREE.MeshBasicMaterial({color:0xffffff})); routeDot.visible=false; scene.add(routeDot);

  // ---- HTML labels ----
  var labelBox=document.getElementById('labels'), labels=[];
  function mkLabel(o){ var el=document.createElement('button'); el.className='lab '+(o.type==='station'?'station':(o.data.n==='' ?'':''));
    el.style.setProperty('--c','#'+(o.type==='world'?o.data.c.toString(16).padStart(6,'0'):'ffcf6b'));
    el.innerHTML='<span class="dot"></span><svg class="ring" viewBox="0 0 34 34"><circle class="bg" cx="17" cy="17" r="14"/><circle class="fg" cx="17" cy="17" r="14"/></svg>'+
      '<span class="nm">'+o.data.n+' <span class="ty">'+o.data.t+'</span></span>';
    el.setAttribute('aria-label','Select '+o.data.n);
    var ring=el.querySelector('.ring .fg'); var C=2*Math.PI*14; ring.style.strokeDasharray=C; ring.style.strokeDashoffset=C; el.__ring=ring; el.__C=C;
    el.addEventListener('click',function(){ select(o,el); });
    labelBox.appendChild(el); o.el=el; labels.push(o); }
  OBJ.forEach(mkLabel);
  // Earth label
  var earthLab=document.createElement('div'); earthLab.className='lab earth big'; earthLab.innerHTML='<span class="dot"></span><span class="nm">Earth <span class="ty">You are here</span></span>'; labelBox.appendChild(earthLab);

  // ---- selection ----
  var sel=null, selEl=null, selT=0, selecting=false, DURs=1.7, locked=false;
  var panel=document.getElementById('panel');
  function select(o,el){ if(sel&&sel.el) sel.el.classList.remove('sel'); sel=o; selEl=el; el.classList.add('sel'); selT=0; selecting=true; locked=false;
    route.visible=true; routeDot.visible=true; controls.autoRotate=false;
    document.getElementById('pk').textContent='Plotting route'; document.getElementById('pnm').textContent=o.data.n; document.getElementById('pty').textContent=o.data.t;
    document.getElementById('pdist').textContent=(o.pos.length()*0.84).toFixed(1)+' ly'; document.getElementById('pcls').textContent=o.type==='station'?'STN':o.data.cls; document.getElementById('prt').textContent='Direct';
    var st=document.getElementById('pst'); st.textContent='Charging jump…'; st.classList.remove('locked'); panel.classList.add('show'); }

  function proj(v){ var p=v.clone().project(camera); return {x:(p.x*0.5+0.5)*innerWidth, y:(-p.y*0.5+0.5)*innerHeight, vis:p.z<1}; }

  fit(); addEventListener('resize',fit);
  var clock=new THREE.Clock();
  function loop(){ requestAnimationFrame(loop); var dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
    earth.rotation.y+=dt*0.06; atmo.rotation.y-=dt*0.02;
    OBJ.forEach(function(o){ if(o.type==='world') o.mesh.rotation.y+=dt*0.12; else { o.mesh.rotation.y+=dt*0.5; if(o.mesh.userData.spin)o.mesh.userData.spin.rotation.x+=dt*0.8; } });
    // selection progress
    if(sel){ if(selecting){ selT+=dt; var k=Math.min(1,selT/DURs);
        if(selEl&&selEl.__ring) selEl.__ring.style.strokeDashoffset=selEl.__C*(1-k);
        var end=EARTH_POS.clone().lerp(sel.pos,k); var pa=routeGeo.attributes.position.array; pa[0]=0;pa[1]=0;pa[2]=0; pa[3]=end.x;pa[4]=end.y;pa[5]=end.z; routeGeo.attributes.position.needsUpdate=true;
        routeDot.position.copy(end);
        if(k>=1){ selecting=false; locked=true; var st=document.getElementById('pst'); st.textContent='◆ Route locked — jump ready'; st.classList.add('locked'); document.getElementById('pk').textContent='Target locked'; routeDot.visible=false; }
      } else { // keep full line
        var pa2=routeGeo.attributes.position.array; pa2[3]=sel.pos.x;pa2[4]=sel.pos.y;pa2[5]=sel.pos.z; routeGeo.attributes.position.needsUpdate=true;
        route.material.opacity=0.6+Math.sin(t*3)*0.25;
      }
    }
    controls.update();
    // position labels
    for(var i=0;i<labels.length;i++){ var o=labels[i], s=proj(o.pos); var e=o.el; if(s.vis){ e.style.display='flex'; e.style.left=s.x+'px'; e.style.top=s.y+'px'; e.style.opacity=Math.min(1, (300/camera.position.distanceTo(o.pos))*0.9+0.25); } else e.style.display='none'; }
    var es=proj(EARTH_POS); earthLab.style.display=es.vis?'flex':'none'; earthLab.style.left=es.x+'px'; earthLab.style.top=(es.y+18)+'px';
    renderer.render(scene,camera);
  }
  loop();
  setTimeout(function(){ document.getElementById('load').classList.add('hide'); },300);

  window.__diag=function(){ return {worlds:WORLDS.length,stations:STATIONS.length,objects:OBJ.length,labels:labels.length,selected:sel?sel.data.n:null,selecting:selecting,locked:locked,routeVisible:route.visible}; };
  window.__select=function(i){ select(OBJ[i],OBJ[i].el); return window.__diag(); };
  window.__adv=function(s){ selT+=(s||1); return window.__diag(); };
})();
</script>
</body>
</html>
