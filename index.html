<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FH STUDIO — Hozan Shaker × Fynn Beckmann</title>
<meta name="description" content="FH Studio — an independent web design studio by Hozan Shaker & Fynn Beckmann. Selected work.">
<meta property="og:title" content="FH STUDIO"><meta property="og:description" content="Independent web design studio · Hozan Shaker × Fynn Beckmann"><meta property="og:type" content="website">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{ --bg:#0a0a0f; --fg:#f4f5fb; --mut:#82869c; --accent:#9b8cff; }
  html,body{height:100%;width:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:"Space Grotesk",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  body{cursor:none;}
  .grain:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.04;
    background-image:radial-gradient(rgba(255,255,255,.6) 1px,transparent 1px);background-size:3px 3px;}

  /* bars */
  .bar{position:fixed;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:24px 34px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);}
  .bar.top{top:0;} .bar.bot{bottom:0;}
  .bar .lo{color:var(--fg);font-weight:700;letter-spacing:.3em;font-size:14px;}
  .bar a{color:var(--mut);text-decoration:none;}
  .hint{display:flex;align-items:center;gap:10px;}
  .hint .ln{width:50px;height:1px;background:linear-gradient(90deg,transparent,var(--mut),transparent);animation:pulse 2.4s infinite;}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

  /* heading */
  .head{position:fixed;left:34px;top:84px;z-index:5;pointer-events:none;}
  .head .k{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);}
  .head h1{font-size:clamp(30px,5.4vw,66px);font-weight:700;line-height:.98;letter-spacing:-.02em;margin-top:8px;max-width:12ch;}
  .head .idx{margin-top:14px;font-size:13px;color:var(--mut);letter-spacing:.1em;}
  .head .idx b{color:var(--fg);}

  /* 3D stage */
  #stage{position:fixed;inset:0;z-index:3;perspective:1600px;overflow:hidden;}
  .wall{position:absolute;top:50%;left:50%;transform-style:preserve-3d;}
  .tile{position:absolute;top:0;left:0;width:30vw;height:62vh;min-width:300px;
    margin:-31vh 0 0 -15vw;border-radius:16px;overflow:hidden;will-change:transform;
    box-shadow:0 30px 80px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.08);
    transition:box-shadow .3s;}
  .tile .ph{position:absolute;inset:0;}
  .tile .grad{position:absolute;inset:0;transform:scale(1.05);transition:transform .6s cubic-bezier(.16,1,.3,1);}
  .tile:hover .grad{transform:scale(1.12);}
  .tile .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,14,0) 35%,rgba(8,8,14,.85) 100%);}
  .tile .meta{position:absolute;left:24px;right:24px;bottom:22px;}
  .tile .cat{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.7);}
  .tile .nm{font-size:clamp(22px,2.4vw,34px);font-weight:700;margin-top:6px;line-height:1;}
  .tile .res{margin-top:10px;font-size:13px;color:#fff;font-weight:600;}
  .tile .res span{color:var(--accent);}
  .tile .view{margin-top:14px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#fff;
    opacity:0;transform:translateY(10px);transition:.4s cubic-bezier(.16,1,.3,1);}
  .tile.active .view{opacity:1;transform:none;}
  .tile.active{box-shadow:0 40px 120px rgba(155,140,255,.35);}
  .num{position:absolute;left:24px;top:20px;font-size:12px;letter-spacing:.1em;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums;}

  /* cursor */
  .dot,.ring{position:fixed;top:0;left:0;z-index:50;border-radius:50%;pointer-events:none;mix-blend-mode:difference;}
  .dot{width:6px;height:6px;background:#fff;margin:-3px 0 0 -3px;}
  .ring{width:40px;height:40px;border:1px solid rgba(255,255,255,.5);margin:-20px 0 0 -20px;display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#fff;transition:width .25s,height .25s,margin .25s;}
  .ring.big{width:84px;height:84px;margin:-42px 0 0 -42px;}
  @media (max-width:760px){ .tile{width:72vw;margin-left:-36vw;} .head{top:74px;} }
  @media (prefers-reduced-motion: reduce){ .hint .ln{animation:none;} }
</style>
</head>
<body class="grain">
<div class="bar top"><span class="lo">FH&nbsp;STUDIO</span><span>Independent Web Design Studio</span><span>Est. 2026</span></div>

<div class="head">
  <div class="k">Selected Work</div>
  <h1>Sites that move people.</h1>
  <div class="idx"><b id="cur">01</b> / <span id="tot">06</span></div>
</div>

<div id="stage"><div class="wall" id="wall"></div></div>

<div class="bar bot">
  <span>Hozan Shaker × Fynn Beckmann</span>
  <span class="hint">Drag to explore <span class="ln"></span></span>
</div>

<div class="dot" id="dot"></div><div class="ring" id="ring">drag</div>

<script>
(function(){
  var PROJECTS=[
    {nm:"Vaulta",      cat:"Fintech",     res:"+212% sign-ups",      g:"linear-gradient(135deg,#6d5bff,#22d3ee)"},
    {nm:"Northwind",   cat:"B2B SaaS",    res:"+147% trials",        g:"linear-gradient(135deg,#0ea5e9,#1e293b)"},
    {nm:"The Frame",   cat:"Editorial",   res:"+340% read time",     g:"linear-gradient(135deg,#f59e0b,#ef4444)"},
    {nm:"Maison Otto", cat:"Luxury",      res:"+168% AOV",           g:"linear-gradient(135deg,#d4af7a,#1c1917)"},
    {nm:"Casa Lumen",  cat:"Hospitality", res:"bookings 8% → 47%",   g:"linear-gradient(135deg,#34d399,#0f766e)"},
    {nm:"Subfrequency",cat:"Music",       res:"+95% tickets",        g:"linear-gradient(135deg,#ec4899,#7c3aed)"}
  ];
  var wall=document.getElementById('wall'), tiles=[];
  PROJECTS.forEach(function(p,i){
    var t=document.createElement('div'); t.className='tile';
    t.innerHTML='<div class="ph"><div class="grad" style="background:'+p.g+'"></div><div class="scrim"></div></div>'+
      '<div class="num">'+String(i+1).padStart(2,'0')+' / 06</div>'+
      '<div class="meta"><div class="cat">'+p.cat+'</div><div class="nm">'+p.nm+'</div>'+
      '<div class="res"><span>'+p.res.split(' ')[0]+'</span> '+p.res.split(' ').slice(1).join(' ')+'</div>'+
      '<div class="view">View project →</div></div>';
    wall.appendChild(t); tiles.push(t);
  });
  document.getElementById('tot').textContent='0'+PROJECTS.length;

  // layout / drag
  var SP=Math.max(360, innerWidth*0.34);      // spacing between tiles (px)
  function spacing(){ SP=Math.max(360, innerWidth*0.34); }
  addEventListener('resize',spacing);
  var scroll=0, target=0, vel=0, dragging=false, lastX=0, maxS=(PROJECTS.length-1)*SP;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  function clamp(v){ return Math.max(0,Math.min(maxS,v)); }
  var stage=document.getElementById('stage');
  stage.addEventListener('pointerdown',function(e){ dragging=true; lastX=e.clientX; vel=0; ring.classList.add('big'); stage.setPointerCapture(e.pointerId); });
  addEventListener('pointermove',function(e){ if(!dragging)return; var dx=e.clientX-lastX; lastX=e.clientX; target=clamp(target-dx*1.1); vel=-dx; });
  addEventListener('pointerup',function(e){ if(!dragging)return; dragging=false; ring.classList.remove('big');
    target=clamp(Math.round(target/SP)*SP); });   // snap to nearest
  addEventListener('wheel',function(e){ target=clamp(target + (e.deltaY+e.deltaX)*0.6); },{passive:true});
  // keyboard
  addEventListener('keydown',function(e){ if(e.key==='ArrowRight') target=clamp(Math.round(target/SP)*SP+SP); if(e.key==='ArrowLeft') target=clamp(Math.round(target/SP)*SP-SP); });

  // hover → active reveal + magnetic cursor label
  tiles.forEach(function(t){ t.addEventListener('mouseenter',function(){ ring.classList.add('big'); ring.textContent='view'; });
    t.addEventListener('mouseleave',function(){ if(!dragging)ring.classList.remove('big'); ring.textContent='drag'; }); });

  function layout(){
    if(!dragging){ if(reduce) target=clamp(target); }
    scroll += (target-scroll)*0.12;
    var curIdx=Math.round(scroll/SP);
    document.getElementById('cur').textContent=String(Math.max(0,Math.min(PROJECTS.length-1,curIdx))+1).padStart(2,'0');
    for(var i=0;i<tiles.length;i++){ var rel=i*SP-scroll;
      var ry=Math.max(-55,Math.min(55,-rel*0.05));            // arc rotation
      var tz=-Math.abs(rel)*0.45 - 60;                         // depth
      var ty=Math.abs(rel)*0.02;
      tiles[i].style.transform='translate3d('+rel+'px,'+ty+'px,'+tz+'px) rotateY('+ry+'deg)';
      tiles[i].style.opacity=String(Math.max(0.25, 1-Math.abs(rel)/(SP*2.4)));
      tiles[i].style.zIndex=String(1000-Math.round(Math.abs(rel)));
      var active=Math.abs(rel)<SP*0.5; tiles[i].classList.toggle('active',active);
    }
  }

  // cursor
  var dot=document.getElementById('dot'), ring=document.getElementById('ring'), rx=innerWidth/2, ry2=innerHeight/2, tx=rx, ty2=ry2;
  addEventListener('mousemove',function(e){ tx=e.clientX; ty2=e.clientY; dot.style.transform='translate('+tx+'px,'+ty2+'px)'; });

  function frame(){ layout(); rx+=(tx-rx)*0.2; ry2+=(ty2-ry2)*0.2; ring.style.transform='translate('+rx+'px,'+ry2+'px)'; requestAnimationFrame(frame); }
  spacing(); maxS=(PROJECTS.length-1)*SP; frame();

  // verification
  window.__diag=function(){ return {tiles:tiles.length, scroll:Math.round(scroll), target:Math.round(target), SP:Math.round(SP), cur:document.getElementById('cur').textContent}; };
  window.__drag=function(px){ target=clamp(target+px); };
})();
</script>
</body>
</html>
